VIEWS.group = (id) => {
  const g = get('groups', id);
  if (!g) return { title:'קבוצות', html:`<div class="empty">הקבוצה לא נמצאה. <a href="#/groups">חזרה</a></div>` };
  const ms = groupMembers(g);
  const sess = all('sessions').filter(x => x.groupId === id).sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const pls = all('plans').filter(pl => pl.groupId === id);
  const tab = APP.grtab || 'details';
  const tabs = [['details','פרטים'], ['members',`משתתפים (${ms.length})`], ['sessions',`מפגשים והקלטות (${sess.length})`], ['plans',`מערכי טיפול (${pls.length})`]];
  let body = '';
  if (tab === 'details') {
    const info = [['אוכלוסייה', g.population], ['מיקום', g.location], ['מועד קבוע', groupWhen(g)], ['תקופה', [g.startDate && fmtDate(g.startDate,{day:'numeric',month:'numeric',year:'numeric'}), g.endDate && fmtDate(g.endDate,{day:'numeric',month:'numeric',year:'numeric'})].filter(Boolean).join(' – ')], ['מנחה שותף/ה', g.coLeader]];
    body = `<div class="grid g2">
      <div class="card"><h2>פרטי הקבוצה<span class="sp"></span><button class="btn sm" data-act="editgroup" data-id="${id}">${ic('edit')} עריכה</button></h2>
        <table class="t"><tbody>${info.map(([k,v]) => `<tr><td class="muted" style="width:120px">${k}</td><td>${esc(v) || '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h2>הסבר ורקע</h2>
        ${g.description ? `<div class="sblock" style="margin-top:0"><div class="q">הסבר</div><div style="white-space:pre-wrap">${esc(g.description)}</div></div>` : ''}
        ${g.background ? `<div class="sblock"><div class="q">רקע</div><div style="white-space:pre-wrap">${esc(g.background)}</div></div>` : ''}
        ${g.notes ? `<div class="sblock"><div class="q">הערות</div><div style="white-space:pre-wrap">${esc(g.notes)}</div></div>` : ''}
        ${!g.description && !g.background && !g.notes ? '<div class="empty">אפשר להוסיף הסבר ורקע בעריכה</div>' : ''}</div>
    </div>`;
  }
  if (tab === 'members') {
    const others = activePatients().filter(p => !(g.memberIds || []).includes(p.id));
    body = `<div class="card"><h2>משתתפי הקבוצה<span class="sp"></span>
        <button class="btn sm" data-act="addmember" data-id="${id}" ${others.length ? '' : 'disabled'}>${ic('plus')} הוספה מרשימת המטופלים</button>
        <button class="btn sm pri" data-act="newmember" data-id="${id}">${ic('plus')} משתתף/ת חדש/ה</button></h2>
      <p class="small muted" style="margin-top:0">כל משתתף/ת הוא/היא רשומה אחת ברשימת המטופלים הראשית — הפרטים, הטפסים והתשלומים נמצאים בכרטיס האישי, בלי כפילות.</p>
      <div class="list">${ms.map(p => { const n = sess.filter(x => attendedBy(x, p.id)).length;
        return `<div class="item"><a href="#/patient/${p.id}" class="row" style="flex:1;min-width:0;text-decoration:none;color:inherit"><div class="avatar">${esc(initials(p))}</div><div class="main"><div class="t">${esc(pname(p.id))}</div><div class="small muted">${esc(p.phone || '')}${sess.length ? ` · נכח/ה ב-${n} מתוך ${sess.length} מפגשים` : ''}</div></div></a>
        <button class="btn sm ghost" data-act="rmmember" data-id="${id}" data-pid="${p.id}" title="הסרה מהקבוצה (הרשומה האישית נשארת)">הסרה</button></div>`; }).join('') || '<div class="empty">אין עדיין משתתפים</div>'}</div></div>`;
  }
  if (tab === 'sessions') body = `
    <div class="row" style="margin-bottom:14px"><input type="search" id="ssearch" placeholder="חיפוש בתמלולים ובסיכומים של הקבוצה…" style="max-width:380px"><span class="sp"></span><button class="btn pri" data-act="newgroupsession" data-id="${id}">${ic('mic')} תיעוד מפגש חדש</button></div>
    <div id="snomatch" class="card hidden"><div class="empty">לא נמצאו מפגשים שמכילים את החיפוש</div></div>
    <div id="slist">${sess.length ? sess.map(sessionCard).join('') : `<div class="card"><div class="empty">אין עדיין מפגשים מתועדים</div></div>`}</div>`;
  if (tab === 'plans') body = `
    <div class="row" style="margin-bottom:14px"><span class="sp"></span><button class="btn pri" data-act="newplan" data-group="${id}">${ic('plus')} מערך חדש לקבוצה</button></div>
    ${pls.map(pl => planCard(pl, { inGroup:true })).join('') || `<div class="card"><div class="empty">אין מערכים משויכים לקבוצה</div></div>`}`;
  return { title: g.name, after: tab === 'sessions' ? setupSessionSearch : null, html: `
    <div class="row" style="margin-bottom:12px"><a href="#/groups" class="btn ghost sm" data-act="gtab" data-tab="groups">${ic('prev')} כל הקבוצות</a>${g.status === 'ended' ? '<span class="chip">הסתיימה</span>' : ''}${g.location ? `<span class="chip">${ic('pin','ic ic-s')} ${esc(g.location)}</span>` : ''}${groupWhen(g) ? `<span class="chip">${ic('clock','ic ic-s')} ${esc(groupWhen(g))}</span>` : ''}</div>
    <div class="tabs">${tabs.map(([k,l]) => `<a href="#" data-act="grtab" data-tab="${k}" class="${tab===k?'on':''}">${l}</a>`).join('')}</div>
    ${body}` };
};

function newGroupSessionDialog(gid, date){
  const g = get('groups', gid); const ms = groupMembers(g);
  const pls = all('plans').filter(pl => pl.groupId === gid || !pl.groupId);
  openDialog({ title:`תיעוד מפגש · ${esc(g.name)}`, submit:'פתיחת המפגש',
    body: `<label class="f">תאריך<input type="date" name="date" value="${esc(date || ymd(new Date()))}"></label>
      <label class="f">מערך טיפול<select name="planId"><option value="">ללא</option>${pls.map(pl => `<option value="${pl.id}">${esc(pl.title)}${pl.groupId ? '' : ' (כללי)'}</option>`).join('')}</select></label>
      <div><b class="small">נוכחות</b><div class="opts" style="margin-top:6px">${ms.map(p => `<label class="check"><input type="checkbox" name="att" value="${p.id}" checked> ${esc(pname(p.id))}</label>`).join('') || '<span class="small muted">אין משתתפים בקבוצה</span>'}</div></div>`,
    onSubmit(fd){
      const d = fd.get('date'); const t = (d === ymd(new Date()) ? hm(new Date()) : (g.time || '10:00'));
      const s = upsert('sessions', { groupId: gid, planId: fd.get('planId') || '', attendance: fd.getAll('att'), date: d + 'T' + t, notes:'', summary:'', plan:'', transcript:'' });
      location.hash = '#/session/' + s.id;
    } });
}

function groupSessionCard(s){
  const g = get('groups', s.groupId); const ms = g ? groupMembers(g) : [];
  const extra = (s.attendance || []).filter(pid => !ms.some(m => m.id === pid)).map(pid => get('patients', pid)).filter(Boolean);
  const pls = all('plans').filter(pl => pl.groupId === s.groupId || !pl.groupId);
  const plan = s.planId ? get('plans', s.planId) : null;
  return `<div class="grid g2" style="margin-bottom:16px">
    <div class="card" style="margin:0"><h2>${ic('users')} נוכחות<span class="sp"></span><span class="chip">${(s.attendance || []).length} / ${ms.length}</span></h2>
      <div class="opts">${[...ms, ...extra].map(p => `<label class="check"><input type="checkbox" data-act="att" data-sid="${s.id}" data-pid="${p.id}" ${(s.attendance || []).includes(p.id) ? 'checked' : ''}> <a href="#/patient/${p.id}">${esc(pname(p.id))}</a></label>`).join('') || '<span class="small muted">אין משתתפים בקבוצה</span>'}</div></div>
    <div class="card" style="margin:0"><h2>${ic('list')} מערך המפגש</h2>
      <select data-sb="planId" data-sid="${s.id}"><option value="">ללא מערך</option>${pls.map(pl => `<option value="${pl.id}" ${s.planId===pl.id?'selected':''}>${esc(pl.title)}</option>`).join('')}</select>
      ${plan ? `<div style="margin-top:10px">${plan.goals ? `<div class="sblock" style="margin-top:0"><div class="q">מטרות</div><div class="clamp">${esc(plan.goals)}</div></div>` : ''}<button type="button" class="btn sm" style="margin-top:8px" data-act="viewplan" data-id="${plan.id}">הצגת המערך המלא</button></div>` : ''}</div>
  </div>`;
}


/* =====================================================================
   REMINDERS — תזכורות לפני פגישות (ווטסאפ + מייל)
   שליחה ידנית: קישור ווטסאפ / מייל מוכן בלחיצה.
   שליחה אוטומטית: האפליקציה כותבת "תיבת דואר יוצא" לדרייב שלך, וסקריפט גוגל
   (Apps Script) בחשבון שלך שולח כל 15 דקות את מה שהגיע זמנו — גם כשהאפליקציה סגורה.
   ===================================================================== */
const REM_DEFAULTS = {
  enabled:false, hoursBefore:24, whatsapp:true, email:true, location:'', signature:'',
  waText:'שלום {שם},\nתזכורת לפגישה של {מטופל} מחר, יום {יום} {תאריך} בשעה {שעה}{מיקום}.\nאם יש שינוי, אשמח לעדכון.\n{חתימה}',
  emailSubject:'תזכורת לפגישה ביום {יום} {תאריך} בשעה {שעה}',
  emailBody:'שלום {שם},\n\nתזכורת לפגישה של {מטופל} מחר, יום {יום} {תאריך} בשעה {שעה}{מיקום}.\nאם יש שינוי, אשמח לעדכון.\n\nבברכה,\n{חתימה}',
};
const remCfg = () => Object.assign({}, REM_DEFAULTS, APP.db?.settings?.reminders || {});
const PLACEHOLDERS = ['שם','מטופל','יום','תאריך','שעה','מיקום','חתימה'];
const fillTpl = (t, v) => String(t || '').replace(/\{(שם|מטופל|יום|תאריך|שעה|מיקום|חתימה)\}/g, (_, k) => v[k] ?? '');
function waPhone(ph){
  let d = String(ph || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0')) d = '972' + d.slice(1);
  return d.length >= 11 ? d : '';
}
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e || '').trim());
function recipientsOf(pid){
  const p = get('patients', pid); if (!p) return [];
  const out = (p.contacts || []).filter(c => c.remind).map(c => ({ name: c.name || pname(pid), phone: c.phone, email: c.email }));
  if (p.remindSelf) out.unshift({ name: p.firstName || pname(pid), phone: p.phone, email: p.email, self:true });
  return out;
}
function computeReminders(days=8){
  const cfg = remCfg(); if (!cfg.enabled) return [];
  const now = Date.now(), until = now + days * 86400000;
  const out = [];
  for (const a of all('appts')) {
    if (a.status !== 'scheduled') continue;
    const at = parseLocal(a.start).getTime(); if (at <= now || at > until) continue;
    const p = get('patients', a.patientId); if (!p) continue;
    const d = parseLocal(a.start);
    for (const r of recipientsOf(a.patientId)) {
      const vars = { 'שם': (r.name || '').split(' ')[0], 'מטופל': r.self ? 'שלך' : (p.firstName || ''), 'יום': DAYS[d.getDay()], 'תאריך': `${d.getDate()}/${d.getMonth()+1}`, 'שעה': hm(d), 'מיקום': cfg.location ? ' ב' + cfg.location.replace(/^ב/, '') : '', 'חתימה': cfg.signature };
      const base = { apptId:a.id, apptAt:new Date(at).toISOString(), sendAt:new Date(at - cfg.hoursBefore * 3600000).toISOString(), name:r.name, patient:pname(a.patientId) };
      if (cfg.whatsapp) { const to = waPhone(r.phone);
        out.push(Object.assign({}, base, { id:`${a.id}|${a.start}|wa|${to || r.name}`, channel:'whatsapp', to, text: fillTpl(cfg.waText, vars), waParams:[vars['שם'], vars['מטופל'], `${vars['יום']} ${vars['תאריך']}`, vars['שעה'], cfg.location || ''], missing: !to && 'אין מספר טלפון תקין' })); }
      if (cfg.email) { const ok = validEmail(r.email);
        out.push(Object.assign({}, base, { id:`${a.id}|${a.start}|em|${ok ? r.email.trim().toLowerCase() : r.name}`, channel:'email', to: ok ? r.email.trim() : '', subject: fillTpl(cfg.emailSubject, vars), body: fillTpl(cfg.emailBody, vars), missing: !ok && 'אין כתובת מייל' })); }
    }
  }
  return out.sort((x, y) => x.sendAt.localeCompare(y.sendAt));
}
function remState(r){
  const log = APP.db.settings.remLog?.[r.id];
  if (log) return { k:'sent', label:`נשלח ${log.by === 'manual' ? 'ידנית ' : ''}${new Date(log.at).toLocaleString('he-IL', { dateStyle:'short', timeStyle:'short' })}`, cls:'ok' };
  const st = APP.remStatus?.[r.id];
  if (st?.status === 'sent') return { k:'sent', label:'נשלח אוטומטית ' + new Date(st.at).toLocaleString('he-IL', { dateStyle:'short', timeStyle:'short' }), cls:'ok' };
  if (r.missing) return { k:'missing', label:r.missing, cls:'' };
  if (st?.status === 'failed') return { k:'due', label:'השליחה האוטומטית נכשלה', cls:'warn', err: st.error };
  if (st?.status === 'waiting') return { k: Date.parse(r.sendAt) <= Date.now() ? 'due' : 'scheduled', label:'ווטסאפ עוד לא חובר לשליחה אוטומטית', cls:'warn' };
  const auto = CFG.reminders.automation && APP.store?.kind === 'drive';
  if (Date.parse(r.sendAt) <= Date.now()) return { k:'due', label: auto ? 'ממתין לשליחה אוטומטית' : 'הגיע זמן השליחה', cls:'warn' };
  return { k:'scheduled', label: (auto ? 'יישלח אוטומטית ' : 'לשליחה ') + new Date(r.sendAt).toLocaleString('he-IL', { weekday:'short', day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit' }), cls:'info' };
}
function remRow(r){
  const st = remState(r), d = parseLocal(get('appts', r.apptId)?.start || r.apptAt.slice(0,16));
  const btn = r.missing ? '' : r.channel === 'whatsapp'
    ? `<a class="btn sm" href="https://wa.me/${r.to}?text=${encodeURIComponent(r.text)}" target="_blank" rel="noopener noreferrer" data-act="remsent" data-id="${esc(r.id)}">ווטסאפ</a>`
    : `<a class="btn sm" href="mailto:${encodeURIComponent(r.to)}?subject=${encodeURIComponent(r.subject)}&body=${encodeURIComponent(r.body)}" data-act="remsent" data-id="${esc(r.id)}">מייל</a>`;
  return `<div class="item" style="cursor:default">
    <span class="chip ${r.channel === 'whatsapp' ? 'ok' : 'info'}" style="min-width:64px;justify-content:center">${r.channel === 'whatsapp' ? 'ווטסאפ' : 'מייל'}</span>
    <div class="main"><div class="t">${esc(r.name)} <span class="muted small">· ${esc(r.patient)}</span></div>
      <div class="small muted">פגישה ${DAYS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1} ${hm(d)} · <bdi dir="ltr">${r.channel === 'whatsapp' ? esc(r.to ? '+' + r.to : '') : esc(r.to)}</bdi></div>
      ${st.err ? `<div class="small" style="color:var(--warn)">${esc(st.err)}</div>` : ''}</div>
    <span class="chip ${st.cls}">${esc(st.label)}</span>${st.k !== 'sent' ? btn : ''}
  </div>`;
}
function remindersView(){
  const cfg = remCfg();
  if (!cfg.enabled) return `<div class="card"><div class="empty">התזכורות כבויות. אפשר להפעיל אותן ב<a href="#/settings">הגדרות</a>.</div></div>`;
  const items = computeReminders(8);
  const groups = { due: [], scheduled: [], missing: [], sent: [] };
  items.forEach(r => groups[remState(r).k].push(r));
  const auto = CFG.reminders.automation && APP.store.kind === 'drive';
  const last = APP.remStatus?._meta?.lastRun;
  const sec = (t, list, empty) => `<div class="card"><h2>${t}<span class="sp"></span><span class="chip">${list.length}</span></h2><div class="list">${list.map(remRow).join('') || `<div class="empty">${empty}</div>`}</div></div>`;
  return `
    <div class="notice ${auto ? 'ok' : ''}" style="margin-bottom:16px">${ic('clock')}<div style="flex:1">
      ${auto ? `<b>שליחה אוטומטית פעילה</b> — ${cfg.hoursBefore} שעות לפני כל פגישה. ${last ? 'הסקריפט רץ לאחרונה ' + new Date(last).toLocaleString('he-IL', { dateStyle:'short', timeStyle:'short' }) + '.' : '<span style="color:var(--warn)">הסקריפט עוד לא דיווח — ודאי שהשלמת את שלב 5 במדריך.</span>'}`
             : `<b>שליחה ידנית</b> — כשמגיע הזמן, התזכורת מופיעה כאן ובמסך הבית, ולחיצה על "ווטסאפ" או "מייל" פותחת הודעה מוכנה. לשליחה אוטומטית — שלב 5 במדריך.`}
      </div>${auto ? `<button class="btn sm" data-act="remrefresh">רענון</button>` : ''}</div>
    ${sec('לשליחה עכשיו', groups.due, 'אין תזכורות שממתינות')}
    ${sec('מתוכננות (8 ימים קרובים)', groups.scheduled, 'אין תזכורות מתוכננות')}
    ${groups.missing.length ? sec('חסרים פרטים', groups.missing, '') : ''}
    ${groups.sent.length ? sec('נשלחו', groups.sent, '') : ''}`;
}

    <form id="remform" class="fgrid">
      <label class="check full"><input type="checkbox" name="enabled" ${c.enabled ? 'checked' : ''}> <b>להפעיל תזכורות</b> — נשלחות לאנשי הקשר המסומנים ב-V בכרטיס המטופל</label>
      <label class="f">כמה שעות לפני הפגישה<input type="number" name="hoursBefore" min="1" max="96" value="${esc(c.hoursBefore)}"></label>

      <label class="f">מיקום הקליניקה (ל-{מיקום})<input type="text" name="location" value="${esc(c.location)}" placeholder="למשל: רחוב הרצל 10, רמת גן"></label>

      <label class="f full">תבנית ווטסאפ<textarea name="waText" style="min-height:110px">${esc(c.waText)}</textarea></label>
      <label class="f full">נושא המייל<input type="text" name="emailSubject" value="${esc(c.emailSubject)}"></label>

      <div class="full"><b class="small">תצוגה מקדימה</b><div class="rempreview" id="rempreview"></div></div>
      <div class="full notice">${ic('shield')}<div>ההודעה נשלחת לאנשים מחוץ לקליניקה. כדאי לא לכלול בה מידע טיפולי. בשליחה אוטומטית, התזכורות של השבוע הקרוב (שם, טלפון/מייל, מועד וטקסט ההודעה) נשמרות <b>ללא ההצפנה של האפליקציה</b> בקובץ בדרייב שלך, כדי שהסקריפט יוכל לשלוח אותן. אחרי שליחה הן נמחקות ממנו.</div></div>
      <div class="full row"><button class="btn pri" type="submit">שמירת הגדרות התזכורות</button><span class="small muted">שליחה אוטומטית: ${CFG.reminders.automation ? (APP.store.kind === 'drive' ? 'מופעלת' : 'פועלת רק בחיבור לגוגל דרייב') : 'כבויה (שלב 5 במדריך)'}</span></div>
    </form></div>`;
}
function bindRemSettings(){
  const f = $('#remform'); if (!f) return;
  const read = () => { const d = new FormData(f); return { enabled: !!d.get('enabled'), hoursBefore: Math.max(1, +d.get('hoursBefore') || 24), whatsapp: !!d.get('whatsapp'), email: !!d.get('email'), location: d.get('location').trim(), signature: d.get('signature').trim(), waText: d.get('waText'), emailSubject: d.get('emailSubject'), emailBody: d.get('emailBody') }; };
  const preview = () => { const c = read(); const v = { 'שם':'רונית', 'מטופל':'נועה', 'יום':'שלישי', 'תאריך':'14/10', 'שעה':'16:00', 'מיקום': c.location ? ' ב' + c.location.replace(/^ב/, '') : '', 'חתימה': c.signature };
    $('#rempreview').innerHTML = `<div class="pv"><div class="pvh">ווטסאפ</div>${esc(fillTpl(c.waText, v))}</div><div class="pv"><div class="pvh">מייל · ${esc(fillTpl(c.emailSubject, v))}</div>${esc(fillTpl(c.emailBody, v))}</div>`; };
  f.oninput = preview; preview();
  f.onsubmit = e => { e.preventDefault(); APP.db.settings.reminders = read(); markDirty(); toast('הגדרות התזכורות נשמרו'); };
}
function markRemSent(id, by='manual'){
  const log = APP.db.settings.remLog ||= {};
  log[id] = { at: Date.now(), by };
  const cutoff = Date.now() - 45 * 86400000;
  for (const k in log) if (log[k].at < cutoff) delete log[k];
  markDirty();
}

/* ---- תיבת דואר יוצא בדרייב (לשליחה האוטומטית) ---- */
const OUTBOX_NAME = 'clinic-reminders-outbox.json', STATUS_NAME = 'clinic-reminders-status.json', REM_FOLDER = 'הקליניקה — תזכורות';
const Outbox = {
  lastJson:null, timer:null,
  async findOrCreate(name, mime, parent, content){
    const q = encodeURIComponent(`name='${name}' and trashed=false`);
    const r = await DriveStore.api(`https://www.googleapis.com/drive/v3/files?spaces=drive&q=${q}&fields=files(id,name)`);
    const f = (await r.json()).files?.[0]; if (f) return f.id;
    if (mime === 'application/vnd.google-apps.folder') {
      const c = await DriveStore.api('https://www.googleapis.com/drive/v3/files?fields=id', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ name, mimeType: mime }) });
      return (await c.json()).id;
    }
    const boundary = 'tv' + uid().replace(/-/g, '');
    const body = new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name, parents:[parent], mimeType: mime })}\r\n--${boundary}\r\nContent-Type: ${mime}\r\n\r\n`, content, `\r\n--${boundary}--`]);
    const c = await DriveStore.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method:'POST', headers:{ 'Content-Type':`multipart/related; boundary=${boundary}` }, body });
    return (await c.json()).id;
  },
  async ids(){
    if (this._ids) return this._ids;
    const folder = await this.findOrCreate(REM_FOLDER, 'application/vnd.google-apps.folder');
    const outbox = await this.findOrCreate(OUTBOX_NAME, 'application/json', folder, '{"items":[]}');
    const status = await this.findOrCreate(STATUS_NAME, 'application/json', folder, '{}');
    return (this._ids = { folder, outbox, status });
  },
  async write(json){
    const { outbox } = await this.ids();
    await DriveStore.api(`https://www.googleapis.com/upload/drive/v3/files/${outbox}?uploadType=media`, { method:'PATCH', headers:{ 'Content-Type':'application/json; charset=UTF-8' }, body: json });
  },
  async readStatus(){
    const { status } = await this.ids();
    const r = await DriveStore.api(`https://www.googleapis.com/drive/v3/files/${status}?alt=media`);
    try { return JSON.parse(await r.text() || '{}'); } catch { return {}; }
  }
};
const autoReminders = () => CFG.reminders.automation && APP.store?.kind === 'drive' && !!APP.key;
function scheduleOutboxSync(){ if (!autoReminders()) return; clearTimeout(Outbox.timer); Outbox.timer = setTimeout(() => syncOutbox().catch(e => console.warn('outbox', e)), 3000); }
async function syncOutbox(){
  if (!autoReminders()) return;
  const cfg = remCfg();
  const items = cfg.enabled ? computeReminders(8).filter(r => !r.missing && !APP.db.settings.remLog?.[r.id] && APP.remStatus?.[r.id]?.status !== 'sent')
    .map(r => ({ id:r.id, channel:r.channel, to:r.to, sendAt:r.sendAt, apptAt:r.apptAt, subject:r.subject, body:r.body, waParams:r.waParams })) : [];
  const json = JSON.stringify({ version:1, generatedAt:new Date().toISOString(), senderName: cfg.signature || '', items });
  if (json.replace(/"generatedAt":"[^"]*",/, '') === (Outbox.lastJson || '').replace(/"generatedAt":"[^"]*",/, '')) return;
  await Outbox.write(json); Outbox.lastJson = json;
}
async function refreshRemStatus(){
  if (!autoReminders()) return;
  APP.remStatusAt = Date.now();
  try { APP.remStatus = await Outbox.readStatus(); if (route().name === 'calendar' && APP.calView === 'rem' && !$('#dlg').open) render(); }
  catch (e) { console.warn('rem status', e); }
}

function addDemoData(){
  const names = [['נועה','לוי','054-1111111'],['יוסי','כהן','052-2222222'],['מיכל','ברק','050-3333333'],['אורי','שחר','053-4444444']];
  const ws = startOfWeek(new Date());
  names.forEach(([firstName, lastName, phone], i) => {
    const p = upsert('patients', { firstName, lastName, phone, status:'active', fee: 350 + i*25, startDate: ymd(addDays(ws, -60)), contacts: i === 0 ? [{ name:'רונית לוי', relation:'אמא', phone:'054-9999999' }] : [] });
    for (let w = -2; w <= 1; w++) {
      const d = addDays(ws, w*7 + 1 + i);
      const past = d < new Date();
      const a = upsert('appts', { patientId:p.id, start: ymd(d) + 'T' + pad(9 + i*2) + ':00', duration:50, fee:p.fee, status: past ? 'done' : 'scheduled' });
      if (past && (w < -1 || i % 2 === 0)) upsert('payments', { patientId:p.id, apptId:a.id, amount:p.fee, date:ymd(d), method: METHODS[i % 3] });
    }
  });
  const kids = names.slice(0, 3).map(([f]) => all('patients').find(p => p.firstName === f)?.id).filter(Boolean);
  const g = upsert('groups', { name:'קבוצת ויסות רגשי', population:'מתבגרים 13–15', description:'קבוצה טיפולית בת 12 מפגשים לחיזוק כלים לויסות רגשי.', background:'נפתחה בשיתוף היועצת של חטיבת הביניים.', location:'חדר 2, מרכז הקהילה', day: String(new Date().getDay()), time:'16:30', duration:90, startDate: ymd(addDays(ws, -21)), status:'active', memberIds: kids });
  const e1 = upsert('equipment', { name:'קלפי רגשות', category:'קלפים', have:1, need:2, location:'ארון בחדר 2' });
  const e2 = upsert('equipment', { name:'בצק משחק', category:'יצירה', have:6, need:6, location:'ארגז יצירה' });
  upsert('equipment', { name:'כריות ישיבה', category:'חדר', have:8, need:10, location:'חדר 2' });
  upsert('plans', { title:'מפגש 4 — מזהים רגשות בגוף', groupId: g.id, duration:'90', goals:'זיהוי תחושות גופניות שמלוות רגשות שונים.', opening:'סבב שם + רגש של היום', main:'עבודה עם קלפי רגשות בזוגות, ואז מיפוי רגשות על שרטוט גוף', closing:'תרגיל נשימה וסבב משפט סיום', equipment:[{ id:e1.id, qty:2 }, { id:e2.id, qty:6 }] });
  toast('נוספו נתוני דוגמה'); render();
}

/* =====================================================================
   actions (event delegation)
   ===================================================================== */
const ACT = {
  pickstore: el => pickStore(el.dataset.kind),
  switchstore: async () => { if (APP.key) await lock(); APP.store = null; DriveStore.token = null; try { localStorage.removeItem('tv-store'); } catch {} showStart(); },
  lock: () => lock(),
  reauth: async () => { try { await DriveStore.auth(); toast('החיבור חודש'); await saveNow(); } catch (e) { toast(e.message, 'err'); } },
  retrysave: () => saveNow().catch(e => toast(e.message, 'err')),
  closedlg: () => $('#dlg').close(),
  // patients
  newpatient: () => patientDialog(),
  editpatient: el => patientDialog(el.dataset.id),
  addcontact: () => $('#contacts').insertAdjacentHTML('beforeend', contactRow()),
  delcontact: el => el.closest('.crow').remove(),
  delpatient: async el => {
    const id = el.dataset.id;
    if (!(await confirmDlg(`למחוק את ${esc(pname(id))}? הפגישות, התשלומים והתיעוד יישארו, אבל לא יהיו משויכים למטופל/ת פעיל/ה. מומלץ לסמן "לא פעיל/ה" במקום.`))) return;
    removeRec('patients', id); location.hash = '#/patients';
  },
  toggleinactive: el => { APP.showInactive = el.checked; render(); },
  ptab: el => { APP.ptab = el.dataset.tab; render(); },
  // appointments
  newappt: el => apptDialog(null, { date: el.dataset.date, patient: el.dataset.patient }),
  editappt: el => apptDialog(el.dataset.id),
  delappt: async el => {
    const a = get('appts', el.dataset.id);
    const series = a.series ? all('appts').filter(x => x.series === a.series && x.start >= a.start && x.status === 'scheduled') : [];
    if (series.length > 1) {
      openDialog({ title:'מחיקת פגישה', body:`<p style="margin:0">זו פגישה מתוך סדרה שבועית.</p>`, submit:'רק הפגישה הזו',
        extra:`<button type="button" class="btn danger" id="delseries">הפגישה וכל הבאות (${series.length})</button>`,
        onSubmit(){ removeRec('appts', a.id); } });
      $('#delseries').onclick = () => { series.forEach(x => removeRec('appts', x.id)); $('#dlg').close(); render(); };
      return;
    }
    if (await confirmDlg('למחוק את הפגישה?')) { removeRec('appts', a.id); render(); }
  },
  week: el => { const d = +el.dataset.d; APP.weekStart = d === 0 ? startOfWeek(new Date()) : addDays(APP.weekStart, d); render(); },
  quickpay: el => {
    const a = get('appts', el.dataset.id); const due = (+a.fee||0) - apptPaid(a);
    upsert('payments', { patientId:a.patientId, apptId:a.id, amount:due, date:ymd(new Date()), method: APP.db.settings.lastMethod || 'העברה בנקאית' });
    $('#dlg').close(); toast(`נרשם תשלום ${money(due)}`); render();
  },
  // payments
  newpayment: el => paymentDialog(null, { patient: el.dataset.patient, appt: el.dataset.appt }),
  editpayment: el => paymentDialog(el.dataset.id),
  delpayment: async el => { if (await confirmDlg('למחוק את התשלום?')) { removeRec('payments', el.dataset.id); render(); } },
  // forms
  newtemplate: () => { APP.tdraft = null; location.hash = '#/form/new'; },
  addfield: () => { APP.tdraft.fields.push({ id: uid().slice(0,8), type:'text', label:'', required:false }); render(); setTimeout(() => { const ins = $$('[data-fb$=":label"]'); ins[ins.length-1]?.focus(); }, 30); },
  delfield: el => { APP.tdraft.fields.splice(+el.dataset.i, 1); render(); },
  mvfield: el => { const i = +el.dataset.i, j = i + +el.dataset.d, f = APP.tdraft.fields; if (j < 0 || j >= f.length) return; [f[i], f[j]] = [f[j], f[i]]; render(); },
  savetemplate: () => {
    const t = APP.tdraft; if (!t.title.trim()) { toast('יש לתת שם לטופס', 'err'); return; }
    if (t.fields.some(f => !f.label.trim())) { toast('לכל שדה צריך להיות טקסט', 'err'); return; }
    const isNew = t.id === 'new'; if (isNew) delete t.id;
    const saved = upsert('templates', structuredClone(t)); APP.tdraft = null; toast('הטופס נשמר');
    void saved; location.hash = '#/forms';
  },
  leavebuilder: () => { APP.tdraft = null; },
  deltemplate: async el => { if (await confirmDlg('למחוק את הטופס? טפסים שכבר מולאו יישמרו.')) { removeRec('templates', el.dataset.id); APP.tdraft = null; location.hash = '#/forms'; } },
  previewtemplate: () => { const t = APP.tdraft; openDialog({ title:'תצוגה מקדימה', wide:true, body:`<div style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0">${esc(t.title)}</h2>${t.description?`<p style="margin:0">${esc(t.description)}</p>`:''}${t.fields.map(fieldHtml).join('')}</div>` }); initSignatures($('#dlg')); },
  fillform: el => {
    const tpls = all('templates');
    openDialog({ title:'מילוי טופס בקליניקה', submit:'מעבר למצב מילוי',
      body: `<label class="f">טופס<select name="tpl" required><option value="">בחירה…</option>${tpls.map(t => `<option value="${t.id}" ${t.id===el.dataset.tpl?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label>
        <label class="f">מטופל/ת<select name="patient" required>${patientOptions(el.dataset.patient)}</select></label>
        <div class="notice">${ic('lock')}<div>במצב מילוי המטופל/ת רואה רק את הטופס. בסיום האפליקציה תינעל ותצטרכי את הסיסמה כדי לחזור.</div></div>`,
      onSubmit(fd){ startKiosk(fd.get('tpl'), fd.get('patient')); return false; } });
  },
  clearsig: el => { const cv = $(`canvas[data-sig="${el.dataset.f}"]`); const ctx = cv.getContext('2d'); ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore(); cv.dataset.empty = '1'; },
  exitkiosk: () => lock(),
  viewresp: el => {
    const r = get('responses', el.dataset.id);
    openDialog({ title:'טופס שמולא', wide:true, body: respHtml(r),
      extra:`<button type="button" class="btn" data-act="printresp" data-id="${r.id}">${ic('print')} הדפסה</button><button type="button" class="btn danger" data-act="delresp" data-id="${r.id}">${ic('trash')} מחיקה</button>` });
  },
  printresp: el => { const pa = $('#printarea'); pa.innerHTML = respHtml(get('responses', el.dataset.id)); pa.classList.remove('hidden'); window.print(); setTimeout(() => { pa.innerHTML = ''; pa.classList.add('hidden'); }, 500); },
  delresp: async el => { const id = el.dataset.id; if (await confirmDlg('למחוק את הטופס שמולא?')) { removeRec('responses', id); render(); } },
  // sessions
  newsession: el => newSessionDialog({ patient: el.dataset.patient }),
  sessionfromappt: el => sessionFromAppt(el.dataset.id),
  recstart: el => startRecording(el.dataset.id),
  recpause: () => pauseRecording(),
  recstop: () => stopRecording(),
  playrec: el => playRecording(el.dataset.id),
  seek: el => seekTo(el.dataset.id, +el.dataset.t),
  transcribe: el => transcribeRecording(el.dataset.id),
  recover: async () => {
    if (APP.store.kind === 'drive' && Date.now() > DriveStore.exp - 60000) { try { await DriveStore.auth(); } catch (e) { toast(e.message, 'err'); return; } }
    recoverRecordings();
  },
  delsession: async el => {
    const id = el.dataset.id; const s = get('sessions', id);
    if (APP.rec?.sessionId === id) { toast('יש לעצור את ההקלטה קודם', 'err'); return; }
    if (!(await confirmDlg('למחוק את התיעוד' + (s.recording ? ' ואת ההקלטה' : '') + '? אי אפשר לשחזר.'))) return;
    if (s.recording) { try { await APP.store.del(s.recording.file); } catch {} }
    removeRec('sessions', id); location.hash = '#/sessions';
  },
  // groups
  gtab: el => { APP.gtab = el.dataset.tab; if (route().name === 'groups') render(); },
  grtab: el => { APP.grtab = el.dataset.tab; render(); },
  toggleended: el => { APP.showEnded = el.checked; render(); },
  newgroup: () => groupDialog(),
  editgroup: el => groupDialog(el.dataset.id),
  delgroup: async el => { const id = el.dataset.id; if (!(await confirmDlg('למחוק את הקבוצה? רשומות המשתתפים והמפגשים המתועדים יישארו. אפשר גם לסמן אותה "הסתיימה" במקום.'))) return; removeRec('groups', id); location.hash = '#/groups'; },
  addmember: el => {
    const g = get('groups', el.dataset.id); const others = activePatients().filter(p => !(g.memberIds || []).includes(p.id));
    openDialog({ title:'הוספת משתתפים מרשימת המטופלים', submit:'הוספה',
      body: `<input type="search" id="msearch" placeholder="חיפוש…"><div class="opts" id="mlist" style="max-height:50vh;overflow:auto">${others.map(p => `<label class="check" data-s="${esc(pname(p.id).toLowerCase())}"><input type="checkbox" name="pid" value="${p.id}"> ${esc(pname(p.id))}</label>`).join('')}</div>`,
      onSubmit(fd){ const add = fd.getAll('pid'); if (!add.length) return false; const cur = get('groups', g.id); cur.memberIds = [...new Set([...(cur.memberIds || []), ...add])]; upsert('groups', cur); toast(`נוספו ${add.length} משתתפים`); } });
    const ms = $('#msearch'); ms.oninput = () => { const q = ms.value.trim().toLowerCase(); $$('#mlist label').forEach(l => l.style.display = !q || l.dataset.s.includes(q) ? '' : 'none'); };
  },
  newmember: el => { const gid = el.dataset.id; patientDialog(null, { title:'משתתף/ת חדש/ה (יתווסף/תתווסף גם לרשימת המטופלים)', onCreated: p => { const g = get('groups', gid); g.memberIds = [...new Set([...(g.memberIds || []), p.id])]; upsert('groups', g); } }); },
  rmmember: async el => { const g = get('groups', el.dataset.id); if (!(await confirmDlg(`להסיר את ${esc(pname(el.dataset.pid))} מהקבוצה? הכרטיס האישי והתיעוד יישארו.`, 'הסרה'))) return; g.memberIds = (g.memberIds || []).filter(x => x !== el.dataset.pid); upsert('groups', g); render(); },
  newgroupsession: el => newGroupSessionDialog(el.dataset.id),
  groupslot: el => {
    const g = get('groups', el.dataset.id), d = el.dataset.date;
    const existing = all('sessions').find(x => x.groupId === g.id && (x.date || '').startsWith(d));
    openDialog({ title: esc(g.name), body: `<div>${ic('cal','ic ic-s')} ${fmtDate(d, { weekday:'long', day:'numeric', month:'long' })} · ${esc(g.time || '')}${g.location ? ' · ' + esc(g.location) : ''}</div><div class="small muted">${groupMembers(g).length} משתתפים</div>
      <div class="row"><a class="btn" href="#/group/${g.id}" data-act="closedlg">${ic('group')} דף הקבוצה</a>${existing ? `<a class="btn pri" href="#/session/${existing.id}" data-act="closedlg">${ic('mic')} פתיחת תיעוד המפגש</a>` : `<button type="button" class="btn pri" data-act="slotsession" data-id="${g.id}" data-date="${d}">${ic('mic')} תיעוד המפגש</button>`}</div>` });
  },
  slotsession: el => { const g = get('groups', el.dataset.id); const s = createGroupSession(g.id, el.dataset.date + 'T' + (g.time || '10:00')); $('#dlg').close(); location.hash = '#/session/' + s.id; },
  att: el => { const s = APP.db.sessions[el.dataset.sid]; const set = new Set(s.attendance || []); el.checked ? set.add(el.dataset.pid) : set.delete(el.dataset.pid); sessionField(s.id, 'attendance', [...set]); },
  // plans & equipment
  newplan: el => planDialog(null, { group: el.dataset.group }),
  editplan: el => planDialog(el.dataset.id),
  viewplan: el => { const pl = get('plans', el.dataset.id); openDialog({ title: esc(pl.title), wide:true, body: planCard(pl).replace('<details class="trx">', '<details class="trx" open>') }); },
  delplan: async el => { if (await confirmDlg('למחוק את מערך הטיפול?')) { removeRec('plans', el.dataset.id); render(); } },
  newequip: () => equipDialog(),
  editequip: (el, e) => { if (e.target.closest('[data-act="eqqty"]')) return; equipDialog(el.dataset.id); },
  eqqty: (el, e) => { e.stopPropagation(); const it = get('equipment', el.dataset.id); it.have = Math.max(0, (+it.have || 0) + +el.dataset.d); upsert('equipment', it); render(); },
  eqfilter: el => { APP.eqFilter = el.dataset.f; render(); },
  delequip: async el => { if (await confirmDlg('למחוק את הפריט? הוא יוסר גם ממערכי הטיפול.')) { const id = el.dataset.id; all('plans').filter(pl => (pl.equipment || []).some(x => x.id === id)).forEach(pl => { pl.equipment = pl.equipment.filter(x => x.id !== id); upsert('plans', pl); }); removeRec('equipment', id); render(); } },
  // reminders
  calview: el => { APP.calView = el.dataset.v; if (route().name === 'calendar') render(); },
  remsent: el => { markRemSent(el.dataset.id); setTimeout(() => { if (APP.key) render(); scheduleOutboxSync(); }, 300); },
  remrefresh: async () => { await refreshRemStatus(); toast('עודכן'); },
  // settings
  demodata: () => addDemoData(),
  backup: async () => {
    try {
      clearTimeout(APP.saveTimer); await saveNow();
      const data = { app:'therapy-vault', exported:new Date().toISOString(), vault: dec.decode(await APP.store.get(VAULT)), db: b64e(await APP.store.get(DBFILE)) };
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type:'application/json' }));
      a.download = `גיבוי-מוצפן-${ymd(new Date())}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('הגיבוי מוצפן — אפשר לפתוח אותו רק עם הסיסמה שלך. ההקלטות לא כלולות.');
    } catch (e) { toast(e.message, 'err'); }
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  if (el.tagName === 'INPUT') { ACT[el.dataset.act](el, e); return; }
  if (el.tagName !== 'A' || el.getAttribute('href') === '#') e.preventDefault();
  ACT[el.dataset.act](el, e);
});

/* ---------------- boot ---------------- */
(function boot(){
  if (!window.isSecureContext || !crypto.subtle) {
    gate(`<h1>נדרש חיבור מאובטח</h1><p>יש לפתוח את האפליקציה בכתובת https (או מקומית). ההצפנה לא זמינה בחיבור לא מאובטח.</p>`);
    return;
  }
  if (location.hash === '#/kiosk') history.replaceState(null, '', location.pathname + '#/home');
  let saved = null; try { saved = localStorage.getItem('tv-store'); } catch {}
  if (saved === 'local') { APP.store = LocalStore; LocalStore.has(VAULT).then(h => h ? showUnlock() : showCreate()); }
  else if (saved === 'drive' && CFG.clientId) { APP.store = DriveStore; DriveStore.loadGis().then(() => { DriveStore.client = google.accounts.oauth2.initTokenClient({ client_id: CFG.clientId, scope: SCOPES(), callback:()=>{} }); }).catch(()=>{}); showUnlock(); }
  else showStart();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
