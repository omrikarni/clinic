<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f7a6a">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; connect-src 'self' https://www.googleapis.com https://speech.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data: blob:; media-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>הקליניקה שלי</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --bg:#f5f2ec; --surface:#ffffff; --surface-2:#faf8f4; --ink:#2a2926; --muted:#6c675f; --line:#e4ded3;
  --accent:#4f7a6a; --accent-ink:#ffffff; --accent-soft:#e6efe9; --warn:#b5654a; --warn-soft:#f7e6df;
  --ok:#3f7d4e; --ok-soft:#e3f0e5; --info-soft:#e8eef6; --info:#3d5f8c; --rec:#c2410c;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181a19; --surface:#222624; --surface-2:#1d201f; --ink:#ebe7e0; --muted:#a49e94; --line:#343936;
    --accent:#7fb19c; --accent-ink:#10201a; --accent-soft:#2a3a33; --warn:#e0937a; --warn-soft:#3b2a24;
    --ok:#86c493; --ok-soft:#24352a; --info-soft:#26303d; --info:#9cb8de; --rec:#fb923c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#181a19; --surface:#222624; --surface-2:#1d201f; --ink:#ebe7e0; --muted:#a49e94; --line:#343936;
  --accent:#7fb19c; --accent-ink:#10201a; --accent-soft:#2a3a33; --warn:#e0937a; --warn-soft:#3b2a24;
  --ok:#86c493; --ok-soft:#24352a; --info-soft:#26303d; --info:#9cb8de; --rec:#fb923c; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.ic{width:20px;height:20px;flex:none}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--surface);border-inline-start:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:19px;padding:4px 12px 18px;display:flex;align-items:center;gap:10px}
.brand .dot{width:28px;height:28px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.side .grow{flex:1}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.top h1{font-size:21px;margin:0;flex:1;font-weight:700}
main{padding:22px 24px 100px;max-width:1150px;width:100%}
.bottom{display:none}
.mobile-only{display:none!important}
@media (max-width:820px){
  .side{display:none}
  .mobile-only{display:inline-grid!important}
  .top{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
  main{padding:16px 16px 110px}
  .bottom{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px max(6px,env(safe-area-inset-bottom));z-index:6}
  .bottom a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;white-space:nowrap;color:var(--muted);text-decoration:none;padding:4px 0}
  .bottom a.on{color:var(--accent)}
}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid > .card + .card{margin-top:0}
@media (max-width:820px){ .g3 .card{padding:14px} .stat{font-size:22px} }
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:40px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{border:none;background:transparent;padding:8px;border-radius:10px;cursor:pointer;display:inline-grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface-2)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.stat{font-size:26px;font-weight:700}
.stat-l{color:var(--muted);font-size:13.5px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px}
.input,input[type=text],input[type=search],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;min-height:42px;font-weight:400}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.check{display:flex;align-items:flex-start;gap:8px;font-weight:500;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.notice{border-radius:12px;padding:12px 14px;background:var(--info-soft);color:var(--ink);font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-soft)}
.notice.ok{background:var(--ok-soft)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:start;font-size:13px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 6px;border-bottom:1px solid var(--line)}
.num{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--accent);border-color:var(--accent)}

/* sync pill */
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync .d{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.pending .d,.sync.saving .d{background:#d4a72c}
.sync.error .d{background:var(--warn)}
.recpill{display:inline-flex;align-items:center;gap:6px;background:var(--rec);color:#fff;border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:700;text-decoration:none}
.recpill .d{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:160px;display:flex;flex-direction:column}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day .dh{padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.day .dh button{border:none;background:none;cursor:pointer;color:var(--muted);padding:2px;border-radius:6px}
.day .dh button:hover{background:var(--surface-2);color:var(--accent)}
.day .db{padding:6px;display:flex;flex-direction:column;gap:6px}
.appt{border-radius:9px;padding:6px 8px;background:var(--accent-soft);cursor:pointer;font-size:13.5px;border-inline-start:3px solid var(--accent)}
.appt .tm{font-weight:700;font-variant-numeric:tabular-nums}
.appt.cancelled{opacity:.55;text-decoration:line-through;background:var(--surface-2);border-color:var(--line)}
.appt.noshow{background:var(--warn-soft);border-color:var(--warn)}
.appt.done{background:var(--ok-soft);border-color:var(--ok)}
.appt.grp{background:var(--info-soft);border-color:var(--info)}
@media (max-width:900px){ .week{grid-template-columns:1fr} .day{min-height:auto} }

/* dialog */
dialog{border:none;border-radius:18px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,18,.45)}
dialog form.d{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
dialog .dh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px;display:flex;align-items:center}
dialog .dh .sp{flex:1}
dialog .dbody{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
dialog .df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
dialog .df .sp{flex:1}

/* gate (login / unlock) */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .box{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.gate h1{margin:0;font-size:24px}
.gate .logo{width:52px;height:52px;border-radius:15px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.gate .logo .ic{width:28px;height:28px}
.err{color:var(--warn);font-weight:600;font-size:14.5px}

/* recorder */
.recorder{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.recbtn{width:64px;height:64px;border-radius:50%;border:none;background:var(--rec);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.recbtn .ic{width:28px;height:28px}
.recbtn.stop{background:var(--ink);color:var(--bg)}
.timer{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:110px}
.meter{flex:1;min-width:120px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}

/* form builder */
.fcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.fcard + .fcard{margin-top:10px}

/* kiosk */
.kiosk{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:24px 16px 60px}
.kiosk .sheet{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.kiosk h1{margin:0;font-size:26px}
.kq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.kq .ql{font-weight:700;font-size:17px}
.kq .req{color:var(--warn)}
.kq.bad{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.kq.info{background:transparent;border:none;padding:4px 0}
.kq.info h3{margin:6px 0 0;font-size:19px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.inline{flex-direction:row;gap:18px}
.sigwrap{border:1px dashed var(--muted);border-radius:12px;background:#fff;position:relative}
.sigwrap canvas{width:100%;height:180px;display:block;touch-action:none;border-radius:12px}
.sigwrap .clr{position:absolute;top:6px;inset-inline-start:6px}
.answer{padding:10px 0;border-bottom:1px solid var(--line)}
.answer .q{font-size:13.5px;color:var(--muted);font-weight:600}
.answer img{max-width:280px;background:#fff;border:1px solid var(--line);border-radius:8px}

.gcard{display:block;text-decoration:none;color:inherit}
.gcard:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.qty{display:inline-flex;align-items:center;gap:2px}
.qty .iconbtn{padding:2px 8px;font-size:16px;font-weight:700}
.eqpick{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
.eqpick .check{align-items:center}
@media (max-width:820px){ .eqt th:nth-child(2),.eqt td:nth-child(2),.eqt th:nth-child(5),.eqt td:nth-child(5),.eqt th:nth-child(6),.eqt td:nth-child(6){display:none} }
.remv{background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.rempreview{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:6px}
.pv{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px}
.pvh{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px;white-space:normal}
code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:13px}
/* sessions in patient card */
.ic-s{width:14px;height:14px}
.scard h2{flex-wrap:wrap}
.slink{color:inherit;text-decoration:none}
.slink:hover{color:var(--accent)}
.player{margin-top:10px}
.player:empty{display:none}
.sblock{margin-top:12px}
.sblock .q{font-size:13px;color:var(--muted);font-weight:600}
.clamp{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
details.trx{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.trx summary{cursor:pointer;font-weight:600;color:var(--accent);list-style-position:inside}
.trlines{max-height:420px;overflow:auto;margin-top:8px;padding-inline-end:4px}
.trlines p{margin:0;padding:6px 0;display:flex;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line)}
.trlines p.hit{background:var(--warn-soft);border-radius:6px}
.ts{flex:none;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:none;border-radius:6px;padding:1px 7px;cursor:pointer;font-family:inherit}
span.ts{cursor:default}
.ts:hover{filter:brightness(.95)}
@media print{
  body *{visibility:hidden}
  #printarea, #printarea *{visibility:visible}
  #printarea{position:absolute;inset:0;padding:20px;color:#000;background:#fff}
}
</style>
</head>

<div id="root"></div>
<dialog id="dlg"></dialog>
<div id="printarea" class="hidden"></div>

<script>
'use strict';
/* =====================================================================
   הקליניקה שלי — אפליקציית ניהול קליניקה מוצפנת
   כל המידע מוצפן במכשיר (AES-256-GCM, מפתח שנגזר מהסיסמה ב-PBKDF2)
   ונשמר מוצפן בלבד: בתיקייה הנסתרת של האפליקציה בגוגל דרייב, או מקומית.
   ===================================================================== */
const CFG = Object.assign({ clientId:'', autoLockMinutes:10, appName:'הקליניקה שלי' }, window.APP_CONFIG || {});
CFG.transcription = Object.assign({ enabled:false, projectId:'', language:'he-IL' }, CFG.transcription || {});
CFG.reminders = Object.assign({ automation:false }, CFG.reminders || {});
const SCOPES = () => 'https://www.googleapis.com/auth/drive.appdata'
  + (CFG.reminders.automation ? ' https://www.googleapis.com/auth/drive.file' : '')
  + (CFG.transcription.enabled && CFG.transcription.projectId ? ' https://www.googleapis.com/auth/cloud-platform' : '');
document.title = CFG.appName;

const APP = {
  store:null, key:null, db:null, ver:0, savedVer:0, saveTimer:null, saving:Promise.resolve(),
  sync:'saved', needAuth:false, lastActivity:Date.now(), kiosk:null, rec:null,
  weekStart:null, tdraft:null, audioUrl:null, recovery:[], trLive:{}, trJob:null
};

/* ---------------- utilities ---------------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : [...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join(''));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseLocal = s => { const [d,t='00:00'] = String(s).split('T'); const [y,m,dd] = d.split('-').map(Number); const [h,mi] = t.split(':').map(Number); return new Date(y, m-1, dd, h||0, mi||0); };
const fmtDate = (s, opt={weekday:'short', day:'numeric', month:'numeric', year:'2-digit'}) => s ? parseLocal(s).toLocaleDateString('he-IL', opt) : '';
const fmtDur = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return (h ? h+':'+pad(m) : m) + ':' + pad(s); };
const money = n => '₪' + (Math.round((+n||0)*100)/100).toLocaleString('he-IL');
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x; };
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function b64e(bytes){ let s=''; for (let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(s); }
function b64d(str){ const s = atob(str); const b = new Uint8Array(s.length); for (let i=0;i<s.length;i++) b[i] = s.charCodeAt(i); return b; }

/* ---------------- encryption ---------------- */
const KDF_ITER = 600000;
async function deriveKey(pass, salt, iter=KDF_ITER){
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptBytes(key, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes));
  const out = new Uint8Array(13 + ct.length); out[0] = 1; out.set(iv, 1); out.set(ct, 13); return out;
}
async function decryptBytes(key, buf){
  const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  if (b[0] !== 1) throw new Error('פורמט הצפנה לא מוכר');
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:b.subarray(1,13)}, key, b.subarray(13)));
}

/* ---------------- local database (IndexedDB) ---------------- */
let _idb = null;
function idb(){
  if (_idb) return _idb;
  _idb = new Promise((res, rej) => {
    const r = indexedDB.open('therapy-vault', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('files'); d.createObjectStore('recparts'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return _idb;
}
async function idbOp(store, mode, fn){
  const d = await idb();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode); const s = tx.objectStore(store); let out;
    const req = fn(s); if (req) req.onsuccess = () => { out = req.result; };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}

class NeedAuth extends Error { constructor(){ super('יש לחדש את החיבור לגוגל דרייב'); } }

const LocalStore = {
  kind:'local', label:'המכשיר הזה בלבד',
  async init(){},
  async refresh(){},
  async has(name){ return (await this.get(name)) !== null; },
  async get(name){ const v = await idbOp('files','readonly', s => s.get(name)); return v ? new Uint8Array(v) : null; },
  async put(name, bytes){ await idbOp('files','readwrite', s => s.put(bytes, name)); },
  async del(name){ await idbOp('files','readwrite', s => s.delete(name)); },
};

const DriveStore = {
  kind:'drive', label:'גוגל דרייב (תיקייה נסתרת של האפליקציה)', token:null, exp:0, client:null, ids:{},
  loadGis(){
    return new Promise((res, rej) => {
      if (window.google?.accounts?.oauth2) return res();
      const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client';
      s.onload = () => res(); s.onerror = () => rej(new Error('לא ניתן לטעון את רכיב ההתחברות של גוגל. בדקי חיבור לאינטרנט.'));
      document.head.appendChild(s);
    });
  },
  async init(){
    await this.loadGis();
    this.client = google.accounts.oauth2.initTokenClient({ client_id: CFG.clientId, scope: SCOPES(), callback: () => {} });
    await this.auth();
    await this.refresh();
  },
  auth(){
    return new Promise((res, rej) => {
      this.client.callback = r => {
        if (r.error) return rej(new Error('ההתחברות לגוגל נכשלה: ' + r.error));
        this.token = r.access_token; this.exp = Date.now() + (Number(r.expires_in||3600) - 120) * 1000; APP.needAuth = false; res();
      };
      this.client.error_callback = e => rej(new Error(e?.type === 'popup_closed' ? 'חלון ההתחברות נסגר' : 'ההתחברות לגוגל נכשלה'));
      this.client.requestAccessToken({ prompt: '' });
    });
  },
  async api(url, opts={}){
    if (!this.token || Date.now() > this.exp) { APP.needAuth = true; throw new NeedAuth(); }
    opts.headers = Object.assign({ Authorization: 'Bearer ' + this.token }, opts.headers || {});
    const r = await fetch(url, opts);
    if (r.status === 401) { this.token = null; APP.needAuth = true; throw new NeedAuth(); }
    if (!r.ok) { let m = ''; try { m = (await r.json()).error?.message || ''; } catch {} throw new Error('שגיאה מול גוגל (' + r.status + ')' + (m ? ': ' + m.slice(0, 160) : '')); }
    return r;
  },
  async refresh(){
    const ids = {}; let pt = '';
    do {
      const r = await this.api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)' + (pt ? '&pageToken=' + encodeURIComponent(pt) : ''));
      const j = await r.json(); for (const f of j.files || []) ids[f.name] = f.id; pt = j.nextPageToken || '';
    } while (pt);
    this.ids = ids;
  },
  async has(name){ return !!this.ids[name]; },
  async get(name){
    const id = this.ids[name]; if (!id) return null;
    const r = await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    return new Uint8Array(await r.arrayBuffer());
  },
  async put(name, bytes){
    const id = this.ids[name];
    const meta = id ? {} : { name, parents: ['appDataFolder'] };
    const url = id ? `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=resumable&fields=id`
                   : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id';
    const r = await this.api(url, { method: id ? 'PATCH' : 'POST', headers: { 'Content-Type':'application/json; charset=UTF-8', 'X-Upload-Content-Type':'application/octet-stream' }, body: JSON.stringify(meta) });
    const loc = r.headers.get('Location');
    if (!loc) return this.putMultipart(name, bytes);
    const r2 = await this.api(loc, { method:'PUT', headers:{ 'Content-Type':'application/octet-stream' }, body: bytes });
    const j = await r2.json(); this.ids[name] = j.id;
  },
  async putMultipart(name, bytes){
    const id = this.ids[name]; const boundary = 'tv' + uid().replace(/-/g,'');
    const meta = JSON.stringify(id ? {} : { name, parents:['appDataFolder'] });
    const body = new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/octet-stream\r\n\r\n`, bytes, `\r\n--${boundary}--`]);
    const url = id ? `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart&fields=id` : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id';
    const r = await this.api(url, { method: id ? 'PATCH' : 'POST', headers:{ 'Content-Type':`multipart/related; boundary=${boundary}` }, body });
    const j = await r.json(); this.ids[name] = j.id;
  },
  async del(name){ const id = this.ids[name]; if (!id) return; await this.api(`https://www.googleapis.com/drive/v3/files/${id}`, { method:'DELETE' }); delete this.ids[name]; },
};

/* ---------------- vault & data model ---------------- */
const VAULT = 'vault.json', DBFILE = 'db.bin', PENDING = 'pending-db.bin';
const COLS = ['patients','appts','payments','templates','responses','sessions','groups','plans','equipment'];
function emptyDb(){ const d = { v:1, settings:{} }; COLS.forEach(c => d[c] = {}); return d; }
function normDb(d){ const e = emptyDb(); for (const c of COLS) e[c] = Object.assign({}, d?.[c] || {}); e.settings = Object.assign({}, d?.settings || {}); return e; }
function mergeDb(a, b){
  const out = emptyDb();
  for (const c of COLS){
    const ids = new Set([...Object.keys(a[c]||{}), ...Object.keys(b[c]||{})]);
    for (const id of ids){ const x = a[c]?.[id], y = b[c]?.[id]; out[c][id] = !x ? y : !y ? x : ((y.updatedAt||0) > (x.updatedAt||0) ? y : x); }
  }
  out.settings = Object.assign({}, b.settings, a.settings);
  return out;
}
async function readEncDb(name){
  const bytes = await APP.store.get(name);
  if (!bytes) return null;
  return normDb(JSON.parse(dec.decode(await decryptBytes(APP.key, bytes))));
}
async function createVault(pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pass, salt);
  const check = await encryptBytes(key, enc.encode('therapy-vault-ok'));
  const meta = { v:1, kdf:'PBKDF2-SHA256', iter:KDF_ITER, salt:b64e(salt), check:b64e(check), created:new Date().toISOString() };
  await APP.store.put(VAULT, enc.encode(JSON.stringify(meta)));
  APP.key = key; APP.db = emptyDb(); seedTemplates(); APP.ver++;
  await saveNow();
}
async function openVault(pass){
  await APP.store.refresh();
  const raw = await APP.store.get(VAULT);
  if (!raw) throw new Error('לא נמצא מידע של האפליקציה בחשבון הזה. ייתכן שהתחברת עם חשבון גוגל אחר.');
  const meta = JSON.parse(dec.decode(raw));
  const key = await deriveKey(pass, b64d(meta.salt), meta.iter || KDF_ITER);
  try { const c = await decryptBytes(key, b64d(meta.check)); if (dec.decode(c) !== 'therapy-vault-ok') throw 0; }
  catch { throw new Error('הסיסמה שגויה'); }
  APP.key = key;
  APP.db = (await readEncDb(DBFILE)) || emptyDb();
  // שינויים שלא הספיקו לעלות לדרייב בפעם הקודמת (נשמרו מוצפנים במכשיר)
  try {
    const p = await LocalStore.get(PENDING);
    if (p && APP.store.kind === 'drive') {
      const pend = normDb(JSON.parse(dec.decode(await decryptBytes(key, p))));
      APP.db = mergeDb(pend, APP.db); APP.ver++; scheduleSave();
    }
  } catch(e) { console.warn('pending merge', e); }
  APP.savedVer = APP.ver;
}

const all = c => Object.values(APP.db?.[c] || {}).filter(r => r && !r.deleted);
const get = (c, id) => { const r = APP.db?.[c]?.[id]; return r && !r.deleted ? r : null; };
function upsert(c, rec){
  rec.id ||= uid(); rec.createdAt ||= Date.now(); rec.updatedAt = Date.now();
  APP.db[c][rec.id] = rec; markDirty(); return rec;
}
function removeRec(c, id){ if (APP.db[c][id]) { APP.db[c][id] = { id, deleted:true, updatedAt:Date.now() }; markDirty(); } }

/* ---------------- saving & sync ---------------- */
function markDirty(){ APP.ver++; setSync('pending'); scheduleSave(); }
function scheduleSave(){ clearTimeout(APP.saveTimer); APP.saveTimer = setTimeout(() => saveNow().catch(()=>{}), 1200); }
function saveNow(){
  const run = async () => {
    if (!APP.key || !APP.db) return;
    const v = APP.ver; const key = APP.key;
    setSync('saving');
    try {
      if (APP.store.kind === 'drive') {
        // קודם עותק מוצפן מקומי, כדי ששום שינוי לא ילך לאיבוד אם אין חיבור
        await LocalStore.put(PENDING, await encryptBytes(key, enc.encode(JSON.stringify(APP.db))));
        await APP.store.refresh();
        const remote = await readEncDb(DBFILE);
        if (remote) APP.db = mergeDb(APP.db, remote);
      }
      await APP.store.put(DBFILE, await encryptBytes(key, enc.encode(JSON.stringify(APP.db))));
      if (APP.store.kind === 'drive' && APP.ver === v) await LocalStore.del(PENDING);
      if (APP.ver === v) { APP.savedVer = v; setSync('saved'); } else setSync('pending');
      scheduleOutboxSync();
    } catch (e) {
      console.error(e); setSync('error', e);
      throw e;
    }
  };
  APP.saving = APP.saving.catch(()=>{}).then(run);
  return APP.saving;
}
async function pullRemote(){
  if (!APP.key || APP.store.kind !== 'drive' || APP.kiosk) return;
  try {
    await APP.saving.catch(()=>{});
    await APP.store.refresh();
    const remote = await readEncDb(DBFILE);
    if (remote) { APP.db = mergeDb(APP.db, remote); if (!$('#dlg').open) render(); }
  } catch(e) { if (e instanceof NeedAuth) setSync('error', e); }
}
function setSync(s, err){
  APP.sync = s; const el = $('#sync'); if (!el) return;
  const txt = { saved:'נשמר', pending:'ממתין לשמירה', saving:'שומר…', error: err instanceof NeedAuth || APP.needAuth ? 'החיבור לדרייב פג' : 'שגיאת שמירה' }[s];
  el.className = 'sync ' + s;
  el.innerHTML = `<span class="d"></span><span>${txt}</span>` + (s === 'error' && APP.needAuth ? ` <button class="btn sm" data-act="reauth">חיבור מחדש</button>` : s === 'error' ? ` <button class="btn sm" data-act="retrysave">ניסיון חוזר</button>` : '');
}

/* ---------------- lock / unlock ---------------- */
async function lock(){
  if (APP.rec) { toast('לא ניתן לנעול בזמן הקלטה'); return; }
  if (APP.ver !== APP.savedVer) { clearTimeout(APP.saveTimer); try { await saveNow(); } catch {} }
  APP.key = null; APP.db = null; APP.kiosk = null; APP.tdraft = null;
  if (APP.audioUrl) { URL.revokeObjectURL(APP.audioUrl); APP.audioUrl = null; }
  if ($('#dlg').open) $('#dlg').close();
  $('#printarea').innerHTML = '';
  showUnlock();
}
setInterval(() => {
  if (!APP.key || APP.rec || APP.trJob || Object.keys(APP.trLive).length || (APP.kiosk && !APP.kiosk.done)) return;
  const mins = +(APP.db?.settings?.autoLock || CFG.autoLockMinutes || 10);
  if (Date.now() - APP.lastActivity > mins * 60000) lock();
}, 15000);
['pointerdown','keydown','touchstart','wheel'].forEach(ev => addEventListener(ev, () => { APP.lastActivity = Date.now(); }, { passive:true }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullRemote(); });
addEventListener('beforeunload', e => { if (APP.rec || (APP.key && APP.ver !== APP.savedVer)) { e.preventDefault(); e.returnValue = ''; } });

function openDialog({ title, body, submit='שמירה', onSubmit, onCancel, extra='', wide=false }){
  const d = $('#dlg');
  if (d.open) d.close();
  d.style.width = wide ? 'min(860px,calc(100vw - 24px))' : '';
  d.innerHTML = `<form class="d" method="dialog" novalidate>
      <div class="dh"><span>${title}</span><span class="sp"></span><button type="button" class="iconbtn" data-close aria-label="סגירה">✕</button></div>
      <div class="dbody">${body}</div>
      <div class="df">${extra}<span class="sp"></span><button type="button" class="btn" data-close>ביטול</button>${onSubmit ? `<button type="submit" class="btn pri">${submit}</button>` : ''}</div>
    </form>`;
  const form = d.querySelector('form');
  d.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { onCancel && onCancel(); d.close(); });
  d.oncancel = () => { onCancel && onCancel(); };
  form.onsubmit = async e => {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    try { const r = await onSubmit(new FormData(form), form); if (r !== false) { d.close(); render(); } }
    catch (er) { toast(er.message, 'err'); }
  };
  d.showModal();
  return d;
}
const confirmDlg = (msg, yes='מחיקה') => new Promise(res => {

});

const apptPaid = a => all('payments').filter(p => p.apptId === a.id).reduce((s,p) => s + (+p.amount||0), 0);
function payChip(a){
  const paid = apptPaid(a), fee = +a.fee || 0;
  if (a.status === 'cancelled') return '';
  if (!CHARGED.includes(a.status)) return paid > 0 ? `<span class="chip ok">שולם מראש</span>` : '';
  if (fee === 0 || paid >= fee) return `<span class="chip ok">שולם</span>`;
  if (paid > 0) return `<span class="chip warn">שולם חלקית</span>`;
  return `<span class="chip warn">לא שולם</span>`;
}
function balance(pid){
  const charged = all('appts').filter(a => a.patientId === pid && CHARGED.includes(a.status)).reduce((s,a) => s + (+a.fee||0), 0);
  const paid = all('payments').filter(p => p.patientId === pid).reduce((s,p) => s + (+p.amount||0), 0);
  return { charged, paid, due: charged - paid };
}

function setupSessionSearch(){
    const inp = $('#ssearch'); if (!inp) return;
    inp.oninput = () => {
      const q = inp.value.trim().toLowerCase(); let shown = 0;
      $$('#slist .scard').forEach(c => {
        const hit = !q || c.dataset.s.includes(q); c.style.display = hit ? '' : 'none'; if (hit) shown++;
        const d = c.querySelector('details.trx');
        if (d) { d.open = !!q && hit && d.dataset.s.includes(q); $$('p', d).forEach(pp => pp.classList.toggle('hit', !!q && pp.textContent.toLowerCase().includes(q))); }
      });
      $('#snomatch').classList.toggle('hidden', shown > 0 || !$$('#slist .scard').length);
    };
}
const payRow = x => `<div class="item" data-act="editpayment" data-id="${x.id}"><div class="main"><div class="t num">${money(x.amount)}</div><div class="small muted">${fmtDate(x.date,{day:'numeric',month:'numeric',year:'2-digit'})} · ${esc(x.method||'')}${x.apptId && get('appts',x.apptId) ? ' · עבור פגישה ' + fmtDate(get('appts',x.apptId).start,{day:'numeric',month:'numeric'}) : ''}${x.note?' · '+esc(x.note):''}</div></div></div>`;
const sessionRow = s => `<a class="item" href="#/session/${s.id}"><div class="avatar">${ic(s.groupId ? 'group' : 'mic')}</div><div class="main"><div class="t">${esc(subj(s))}${s.groupId ? ' <span class="chip">קבוצה</span>' : ''}</div><div class="small muted">${fmtDate(s.date)}${s.recording ? ' · הקלטה ' + fmtDur(s.recording.durationSec) : ''}</div></div>${s.recording ? '<span class="chip acc">מוקלט</span>' : ''}${s.transcript ? '<span class="chip info">מתומלל</span>' : ''}${s.summary ? '<span class="chip ok">יש סיכום</span>' : ''}</a>`;
const parseTs = t => t.split(':').map(Number).reduce((a, b) => a * 60 + b, 0);
function trLine(l, sid, hasRec){
  const m = l.match(/^\[(\d+(?::\d\d){1,2})\]\s*(.*)$/);
  if (!m) return `<p>${esc(l)}</p>`;
  const ts = hasRec ? `<button type="button" class="ts" data-act="seek" data-id="${sid}" data-t="${parseTs(m[1])}" title="השמעה מנקודה זו">${m[1]}</button>` : `<span class="ts">${m[1]}</span>`;
  return `<p>${ts}${esc(m[2])}</p>`;
}
function transcriptReader(s){
  const lines = (s.transcript || '').split('\n').filter(l => l.trim());
  if (!lines.length) return '';
  return `<details class="trx" data-s="${esc((s.transcript||'').toLowerCase())}"><summary>תמלול מלא · ${lines.length} קטעים${s.recording ? ' · לחיצה על זמן משמיעה מאותה נקודה' : ''}</summary><div class="trlines">${lines.map(l => trLine(l, s.id, !!s.recording)).join('')}</div></details>`;
}
function sessionCard(s){
  const r = s.recording, recNow = APP.rec?.sessionId === s.id;
  const hay = [s.transcript, s.summary, s.notes, s.plan].filter(Boolean).join(' ').toLowerCase();
  return `<div class="card scard" data-s="${esc(hay)}">
    <h2><a href="#/session/${s.id}" class="slink">${fmtDate(s.date, { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</a>${s.groupId && route().name !== 'group' ? `<a class="chip acc" href="#/group/${s.groupId}" style="text-decoration:none">${ic('group','ic ic-s')} ${esc(gname(s.groupId))}</a>` : ''}${s.groupId ? `<span class="chip">${(s.attendance || []).length} משתתפים</span>` : ''}${s.planId && get('plans', s.planId) ? `<span class="chip">${ic('list','ic ic-s')} ${esc(get('plans', s.planId).title)}</span>` : ''}<span class="sp"></span>
      ${r ? `<span class="chip acc">${ic('mic','ic ic-s')} ${fmtDur(r.durationSec)}</span>` : ''}<span id="trstatus-${s.id}">${trStatusHtml(s)}</span>
      <a class="btn sm" href="#/session/${s.id}">${ic('edit')} פתיחה</a></h2>
    ${recNow ? `<div class="notice warn">${ic('mic')}<div>הטיפול מוקלט כעת. <a href="#/session/${s.id}">מעבר למסך ההקלטה</a></div></div>`
      : r ? `<div class="row"><button class="btn sm" data-act="playrec" data-id="${s.id}">${ic('play')} השמעת ההקלטה</button>${TR.enabled() ? `<button class="btn sm" data-act="transcribe" data-id="${s.id}">${s.transcript ? 'תמלול מחדש' : 'תמלול ההקלטה'}</button>` : ''}</div><div id="player-${s.id}" class="player"></div>`
      : `<div class="small muted">לטיפול הזה אין הקלטה</div>`}
    ${s.summary ? `<div class="sblock"><div class="q">סיכום</div><div class="clamp">${esc(s.summary)}</div></div>` : ''}
    ${transcriptReader(s)}
  </div>`;
}

VIEWS.calendar = () => {
  if (!APP.weekStart) APP.weekStart = startOfWeek(new Date());
  const ws = APP.weekStart, today = ymd(new Date());
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const from = ymd(days[0]), to = ymd(addDays(ws, 7));
  const appts = all('appts').filter(a => a.start >= from && a.start < to).sort((a,b) => a.start.localeCompare(b.start));
  const weekFee = appts.filter(a => a.status !== 'cancelled').reduce((s,a) => s + (+a.fee||0), 0);
  const calSeg = `<div class="seg" style="margin-bottom:14px"><button class="${APP.calView !== 'rem' ? 'on' : ''}" data-act="calview" data-v="week">${ic('cal','ic ic-s')} שבוע</button><button class="${APP.calView === 'rem' ? 'on' : ''}" data-act="calview" data-v="rem">תזכורות</button></div>`;
  if (APP.calView === 'rem') return { title:'יומן', html: calSeg + remindersView(), after: () => { if (Date.now() - (APP.remStatusAt || 0) > 60000) refreshRemStatus(); } };
  return { title:'יומן', html: calSeg + `
    <div class="row" style="margin-bottom:14px">
      <button class="iconbtn" data-act="week" data-d="-7" title="שבוע קודם">${ic('prev')}</button>
      <button class="btn sm" data-act="week" data-d="0">היום</button>
      <button class="iconbtn" data-act="week" data-d="7" title="שבוע הבא">${ic('next')}</button>
      <b>${days[0].toLocaleDateString('he-IL',{day:'numeric',month:'long'})} – ${days[6].toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'})}</b>
      <span class="sp"></span>
      <span class="small muted">${appts.filter(a=>a.status!=='cancelled').length} פגישות · ${money(weekFee)}</span>
      <button class="btn pri" data-act="newappt">${ic('plus')} פגישה חדשה</button>
    </div>
    <div class="week">${days.map(d => { const k = ymd(d); const list = appts.filter(a => a.start.startsWith(k));
      return `<div class="day ${k===today?'today':''}"><div class="dh"><span>${DAYS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</span><button data-act="newappt" data-date="${k}" title="פגישה ביום זה">${ic('plus')}</button></div>
        <div class="db">${[...list.map(a => ({ t: a.start.slice(11), h: `<div class="appt ${a.status}" data-act="editappt" data-id="${a.id}"><div class="row" style="gap:6px"><span class="tm">${hm(parseLocal(a.start))}</span><span>${esc(pname(a.patientId))}</span></div><div class="row" style="gap:4px;margin-top:3px">${payChip(a)}</div></div>` })),
          ...groupsOn(k).map(g => ({ t: g.time || '', h: `<div class="appt grp" data-act="groupslot" data-id="${g.id}" data-date="${k}"><div class="row" style="gap:6px"><span class="tm">${esc(g.time || '')}</span><span>${ic('group','ic ic-s')} ${esc(g.name)}</span></div>${g.location ? `<div class="small muted">${esc(g.location)}</div>` : ''}</div>` }))]
          .sort((x, y) => x.t.localeCompare(y.t)).map(x => x.h).join('')}</div></div>`; }).join('')}</div>` };
};

function apptDialog(id, preset={}){
  const isNew = !id;
  const a = id ? structuredClone(get('appts', id)) : { status:'scheduled', duration: APP.db.settings.defaultDuration || 50, patientId: preset.patient || '', start: (preset.date || ymd(new Date())) + 'T' + (preset.time || '10:00') };
  if (isNew && a.patientId) a.fee = get('patients', a.patientId)?.fee || '';
  const [date, time] = a.start.split('T');
  const paid = id ? apptPaid(a) : 0;
  const pays = id ? all('payments').filter(p => p.apptId === id) : [];
  const sess = id ? all('sessions').find(s => s.apptId === id) : null;
  openDialog({
    title: isNew ? 'פגישה חדשה' : 'פגישה',
    body: `
      <div class="fgrid">
        <label class="f full">מטופל/ת *<select name="patientId" required id="ap-p">${patientOptions(a.patientId)}</select></label>
        <label class="f">תאריך *<input type="date" name="date" required value="${esc(date)}"></label>
        <label class="f">שעה *<input type="time" name="time" required value="${esc(time)}"></label>
        <label class="f">משך (דקות)<input type="number" name="duration" min="5" step="5" value="${esc(a.duration)}"></label>
        <label class="f">מחיר (₪)<input type="number" name="fee" id="ap-fee" min="0" step="1" value="${esc(a.fee)}"></label>

        ${isNew ? `<label class="f full">חזרה שבועית<select name="repeat"><option value="1">פגישה חד-פעמית</option>${[4,8,12,26,52].map(n => `<option value="${n}">כל שבוע, ${n} פגישות</option>`).join('')}</select></label>` : ''}
        <label class="f full">הערה<input type="text" name="note" value="${esc(a.note)}"></label>
      </div>
      ${a.patientId && remCfg().enabled ? `<div class="small muted">${ic('clock','ic ic-s')} תזכורת ${remCfg().hoursBefore} שעות לפני: ${esc(recipientsOf(a.patientId).map(r => r.name).join(', ') || 'אין נמענים מסומנים (V) בכרטיס המטופל')}</div>` : ''}
      ${!isNew ? `<div class="fcard"><div class="row"><b>תשלום</b><span class="sp"></span>${payChip(a) || `<span class="chip">${paid>0?'שולם '+money(paid):'טרם שולם'}</span>`}</div>
        ${pays.map(p => `<div class="small">${money(p.amount)} · ${esc(p.method)} · ${fmtDate(p.date,{day:'numeric',month:'numeric',year:'2-digit'})}</div>`).join('')}
        ${paid < (+a.fee||0) ? `<div class="row"><button type="button" class="btn sm pri" data-act="quickpay" data-id="${id}">רישום תשלום ${money((+a.fee||0)-paid)}</button><button type="button" class="btn sm" data-act="newpayment" data-patient="${a.patientId}" data-appt="${id}">תשלום אחר…</button></div>` : ''}
      </div>
      <div class="row">${sess ? `<a class="btn" href="#/session/${sess.id}" data-act="closedlg">${ic('mic')} פתיחת תיעוד הטיפול</a>` : `<button type="button" class="btn" data-act="sessionfromappt" data-id="${id}">${ic('mic')} התחלת תיעוד טיפול</button>`}
      <button type="button" class="btn" data-act="fillform" data-patient="${a.patientId}">${ic('file')} מילוי טופס</button></div>` : ''}`,
    extra: !isNew ? `<button type="button" class="btn danger" data-act="delappt" data-id="${id}">${ic('trash')} מחיקה</button>` : '',
    onSubmit(fd){
      const base = { patientId: fd.get('patientId'), duration: +fd.get('duration') || 50, fee: fd.get('fee'), status: fd.get('status'), note: (fd.get('note')||'').trim() };
      const t = fd.get('time');
      if (isNew) {
        const n = +fd.get('repeat') || 1; const d0 = parseLocal(fd.get('date'));
        const series = n > 1 ? uid() : undefined;
        for (let i = 0; i < n; i++) upsert('appts', Object.assign({}, base, { start: ymd(addDays(d0, i*7)) + 'T' + t, series, status: i === 0 ? base.status : 'scheduled' }));
        if (n > 1) toast(`נוספו ${n} פגישות`);
      } else upsert('appts', Object.assign(a, base, { start: fd.get('date') + 'T' + t }));
    }
  });
  const sel = $('#ap-p'); sel && (sel.onchange = () => { const p = get('patients', sel.value); if (p?.fee && !$('#ap-fee').value) $('#ap-fee').value = p.fee; });

VIEWS.payments = () => {

  const pays = all('payments').filter(p => (p.date||'').startsWith(month)).sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const total = pays.reduce((s,p) => s + (+p.amount||0), 0);
  const byMethod = {}; pays.forEach(p => byMethod[p.method] = (byMethod[p.method]||0) + (+p.amount||0));
  const rows = all('patients').map(p => ({ p, b: balance(p.id) })).filter(x => x.b.charged || x.b.paid).sort((a,b) => b.b.due - a.b.due);

      <div class="card"><div class="stat-l">סה״כ יתרות פתוחות</div><div class="stat num" style="color:var(--warn)">${money(rows.reduce((s,x) => s + Math.max(0,x.b.due), 0))}</div></div>

      <div class="card"><h2>תשלומים בחודש</h2><div class="list">${pays.length ? pays.map(x => payRow(x).replace('<div class="t num">', `<div class="t num">${esc(pname(x.patientId))} · `)).join('') : '<div class="empty">אין תשלומים בחודש זה</div>'}</div></div>
      <div class="card"><h2>מצב חשבון לפי מטופל/ת</h2>
        <table class="t"><thead><tr><th>שם</th><th>חויב</th><th>שולם</th><th>יתרה</th></tr></thead><tbody>
        ${rows.map(x => `<tr><td><a href="#/patient/${x.p.id}">${esc(pname(x.p.id))}</a></td><td class="num">${money(x.b.charged)}</td><td class="num">${money(x.b.paid)}</td><td class="num" style="font-weight:700;color:${x.b.due>0?'var(--warn)':'var(--ok)'}">${money(x.b.due)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">אין נתונים</td></tr>'}

function fieldHtml(f){
  const req = f.required ? ' <span class="req">*</span>' : '';
  const n = `name="f_${f.id}"`;
  if (f.type === 'info') return `<div class="kq info" data-fid="${f.id}">${f.label.length < 60 && !f.label.includes('\n') ? `<h3>${esc(f.label)}</h3>` : `<p style="margin:0;white-space:pre-wrap">${esc(f.label)}</p>`}</div>`;
  let input = '';
  switch (f.type) {
    case 'textarea': input = `<textarea ${n}></textarea>`; break;
    case 'number': input = `<input type="number" ${n} inputmode="decimal">`; break;
    case 'date': input = `<input type="date" ${n}>`; break;
    case 'phone': input = `<input type="tel" ${n} inputmode="tel">`; break;
    case 'email': input = `<input type="email" ${n}>`; break;
    case 'radio': input = `<div class="opts">${(f.options||[]).map(o => `<label class="check"><input type="radio" ${n} value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`; break;
    case 'checks': input = `<div class="opts">${(f.options||[]).map(o => `<label class="check"><input type="checkbox" ${n} value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`; break;
    case 'yesno': input = `<div class="opts inline"><label class="check"><input type="radio" ${n} value="כן"> כן</label><label class="check"><input type="radio" ${n} value="לא"> לא</label></div>`; break;
    case 'signature': input = `<div class="sigwrap"><canvas data-sig="${f.id}"></canvas><button type="button" class="btn sm clr" data-act="clearsig" data-f="${f.id}">ניקוי</button></div><span class="small muted">חתמו באצבע או בעכבר</span>`; break;
    default: input = `<input type="text" ${n}>`;
  }
  return `<div class="kq" data-fid="${f.id}"><div class="ql">${esc(f.label)}${req}</div>${input}</div>`;
}
function initSignatures(root){
  $$('canvas[data-sig]', root).forEach(cv => {
    const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    let drawing = false; cv.dataset.empty = '1';
    const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.onpointerdown = e => { drawing = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); };
    cv.onpointermove = e => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); cv.dataset.empty = '0'; };
    cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
  });
}
function collectAnswers(form, fields){
  const ans = {}; let firstBad = null;
  $$('.kq', form).forEach(q => q.classList.remove('bad'));
  for (const f of fields) {
    if (f.type === 'info') continue;
    let v;
    if (f.type === 'checks') v = $$(`[name="f_${f.id}"]:checked`, form).map(i => i.value);
    else if (f.type === 'signature') { const cv = $(`canvas[data-sig="${f.id}"]`, form); v = cv && cv.dataset.empty === '0' ? cv.toDataURL('image/png') : ''; }
    else if (['radio','yesno'].includes(f.type)) v = $(`[name="f_${f.id}"]:checked`, form)?.value || '';
    else v = ($(`[name="f_${f.id}"]`, form)?.value || '').trim();
    const empty = Array.isArray(v) ? !v.length : !v;
    if (f.required && empty) { const q = $(`.kq[data-fid="${f.id}"]`, form); q.classList.add('bad'); firstBad ||= q; }
    ans[f.id] = v;
  }
  return { ans, firstBad };
}

/* ---- recorder ---- */
function recElapsed(){ const r = APP.rec; if (!r) return 0; return (r.acc + (r.paused ? 0 : (Date.now() - r.segStart))) / 1000; }
async function startRecording(sessionId){
  if (APP.rec) return;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { toast('הדפדפן הזה לא תומך בהקלטה', 'err'); return; }
  // טיפול נמשך כשעה והחיבור לגוגל תקף לשעה — מחדשים אותו עכשיו, כדי שהתמלול וההעלאה יעבדו עד הסוף
  if (APP.store.kind === 'drive' && DriveStore.exp - Date.now() < 55*60000) { try { await DriveStore.auth(); } catch (e) { toast('לא ניתן לחדש את החיבור לגוגל: ' + e.message, 'err'); } }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } }); }
  catch { toast('אין גישה למיקרופון. יש לאשר גישה בהגדרות הדפדפן.', 'err'); return; }
  const mime = ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  const mr = new MediaRecorder(stream, mime ? { mimeType:mime, audioBitsPerSecond:32000 } : {});
  const rec = { sessionId, mr, stream, mime: mr.mimeType || mime || 'audio/webm', chunks:[], idx:0, writes:[], acc:0, segStart:Date.now(), paused:false, key:APP.key };
  mr.ondataavailable = e => {
    if (!e.data || !e.data.size) return;
    rec.chunks.push(e.data);
    const i = rec.idx++;
    rec.writes.push((async () => {
      const bytes = new Uint8Array(await e.data.arrayBuffer());
      const data = await encryptBytes(rec.key, bytes);
      await idbOp('recparts', 'readwrite', s => s.put({ sessionId, idx:i, mime:rec.mime, data }, sessionId + ':' + String(i).padStart(6,'0')));
    })().catch(err => console.error('chunk save', err)));
  };
  mr.start(30000);
  // מד עוצמה
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(); const src = ac.createMediaStreamSource(stream); const an = ac.createAnalyser(); an.fftSize = 512; src.connect(an);
    const buf = new Uint8Array(an.fftSize); rec.ac = ac;
    if (TR.enabled()) startLiveTranscription(rec, ac, src);
    const tick = () => { if (APP.rec !== rec) return; an.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128)); const el = $('#rmeter'); if (el) el.style.width = Math.min(100, m / 1.0) + '%'; requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  } catch {}
  try { rec.wake = await navigator.wakeLock?.request('screen'); } catch {}
  rec.timer = setInterval(() => { const t = $('#rtimer'); if (t && APP.rec === rec) t.textContent = fmtDur(recElapsed()); updateRecPill(); }, 500);
  APP.rec = rec;
  const s = APP.db.sessions[sessionId]; s.recStartedAt = Date.now(); upsert('sessions', s);
  render();
}
function pauseRecording(){
  const r = APP.rec; if (!r) return;
  if (r.paused) { r.mr.resume(); r.segStart = Date.now(); r.paused = false; }
  else { r.mr.pause(); r.acc += Date.now() - r.segStart; r.paused = true; }
  render();
}
async function stopRecording(){
  const r = APP.rec; if (!r) return;
  // החיבור לגוגל תקף לשעה; אם הוא עומד לפוג, מחדשים אותו כבר עכשיו (בזמן הלחיצה) כדי שההעלאה תצליח
  const authP = (APP.store.kind === 'drive' && Date.now() > DriveStore.exp - 5*60000) ? DriveStore.auth().catch(() => {}) : null;
  const stopped = new Promise(res => r.mr.addEventListener('stop', res, { once:true }));
  if (r.tr) { flushSegment(r); r.tr.active = false; try { r.tr.node.disconnect(); } catch {} finishLive(r.sessionId); }
  if (!r.paused) r.acc += Date.now() - r.segStart;
  r.mr.stop(); await stopped;
  r.stream.getTracks().forEach(t => t.stop()); clearInterval(r.timer);
  try { r.ac?.close(); } catch {} try { r.wake?.release(); } catch {}
  await Promise.all(r.writes);
  const durationSec = Math.round(r.acc / 1000);
  APP.rec = null;
  toast('שומר את ההקלטה המוצפנת…');
  render();
  if (authP) await authP;
  await uploadRecording(r.sessionId, new Blob(r.chunks, { type:r.mime }), r.mime, durationSec);
}
async function uploadRecording(sessionId, blob, mime, durationSec){
  const s = APP.db.sessions[sessionId];
  const file = 'rec-' + sessionId + '.bin';
  try {
    const encd = await encryptBytes(APP.key, new Uint8Array(await blob.arrayBuffer()));
    await APP.store.put(file, encd);
    if (s && !s.deleted) { s.recording = { file, mime, size: blob.size, durationSec }; upsert('sessions', s); }
    await clearRecParts(sessionId);
    APP.recovery = APP.recovery.filter(x => x !== sessionId);
    toast('ההקלטה נשמרה');
    render();
  } catch (e) {
    console.error(e);
    toast('ההקלטה שמורה מוצפנת במכשיר אך לא עלתה עדיין. אפשר לנסות שוב ממסך הבית.', 'err');
    if (!APP.recovery.includes(sessionId)) APP.recovery.push(sessionId);
  }
}
async function clearRecParts(sessionId){
  const keys = await idbOp('recparts','readonly', s => s.getAllKeys());
  const mine = (keys || []).filter(k => String(k).startsWith(sessionId + ':'));
  if (mine.length) await idbOp('recparts','readwrite', s => { mine.forEach(k => s.delete(k)); });
}
async function checkRecovery(){
  try {
    const keys = await idbOp('recparts','readonly', s => s.getAllKeys());
    APP.recovery = [...new Set((keys || []).map(k => String(k).split(':')[0]))];
  } catch { APP.recovery = []; }
}
async function recoverRecordings(){
  for (const sid of [...APP.recovery]) {
    const parts = (await idbOp('recparts','readonly', s => s.getAll())).filter(p => p.sessionId === sid).sort((a,b) => a.idx - b.idx);
    if (!parts.length) continue;
    try {
      const blobs = []; for (const p of parts) blobs.push(await decryptBytes(APP.key, p.data));
      const s = APP.db.sessions[sid];
      if (!s || s.deleted) { if (await confirmDlg('נמצאה הקלטה של תיעוד שנמחק. למחוק אותה מהמכשיר?')) await clearRecParts(sid); continue; }
      const dur = s.recording?.durationSec || Math.round(blobs.reduce((n,b) => n + b.length, 0) / 4000);
      await uploadRecording(sid, new Blob(blobs, { type: parts[0].mime }), parts[0].mime, dur);
    } catch (e) { toast('לא ניתן לפענח את ההקלטה (ייתכן שהוקלטה עם סיסמה אחרת)', 'err'); }
  }
  render();
}
async function playRecording(id, autoplay=true){
  const s = get('sessions', id); if (!s?.recording) return null;
  const box = $('#player-' + id); if (!box) return null;
  $$('.player').forEach(b => { if (b !== box) b.innerHTML = ''; });
  box.innerHTML = '<span class="muted small">מוריד ומפענח את ההקלטה…</span>';
  try {
    const bytes = await APP.store.get(s.recording.file);
    if (!bytes) throw new Error('קובץ ההקלטה לא נמצא');
    const plain = await decryptBytes(APP.key, bytes);
    if (APP.audioUrl) URL.revokeObjectURL(APP.audioUrl);
    APP.audioUrl = URL.createObjectURL(new Blob([plain], { type: s.recording.mime }));
    box.innerHTML = `<audio controls preload="metadata" src="${APP.audioUrl}" style="width:100%"></audio>`;
    const au = box.querySelector('audio');
    await new Promise(res => { au.addEventListener('loadedmetadata', res, { once:true }); au.addEventListener('error', res, { once:true }); setTimeout(res, 5000); });
    // הקלטות דפדפן נשמרות בלי אורך מוגדר; מחשבים אותו כדי שאפשר יהיה לקפוץ לכל נקודה
    if (!isFinite(au.duration)) {
      await new Promise(res => {
        const h = () => { if (isFinite(au.duration)) { au.removeEventListener('durationchange', h); res(); } };
        au.addEventListener('durationchange', h); au.currentTime = 1e7; setTimeout(res, 4000);
      });
      au.currentTime = 0;
    }
    if (autoplay) au.play().catch(() => {});

}
async function seekTo(id, t){
  const box = $('#player-' + id); if (!box) return;
  let au = box.querySelector('audio');
  if (!au) au = await playRecording(id, false);

/* =====================================================================
   TRANSCRIPTION — Google Cloud Speech-to-Text, בחשבון שלך
   האודיו נשלח בחיבור מוצפן לעיבוד ואינו נשמר אצל גוגל; התמלול עצמו נשמר אצלך מוצפן.
   ===================================================================== */
const TR = {
  configured(){ return !!(CFG.transcription.enabled && CFG.transcription.projectId); },
  enabled(){ return this.configured() && APP.store?.kind === 'drive'; },
  async recognize(pcm){
    const body = { config: { encoding:'LINEAR16', sampleRateHertz:16000, audioChannelCount:1, languageCode: CFG.transcription.language || 'he-IL' },
                   audio: { content: b64e(new Uint8Array(pcm.buffer, pcm.byteOffset, pcm.byteLength)) } };
    const r = await DriveStore.api('https://speech.googleapis.com/v1/speech:recognize', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-user-project': CFG.transcription.projectId }, body: JSON.stringify(body) });
    const j = await r.json();
    return (j.results || []).map(x => x.alternatives?.[0]?.transcript || '').join(' ').replace(/\s+/g, ' ').trim();
  }
};
const SR = 16000;
function downsample(buf, ratio){
  if (ratio === 1) return Float32Array.from(buf);
  const n = Math.floor(buf.length / ratio), out = new Float32Array(n);
  for (let i = 0; i < n; i++) { const a = Math.floor(i * ratio), b = Math.min(buf.length, Math.floor((i + 1) * ratio)); let sum = 0; for (let j = a; j < b; j++) sum += buf[j]; out[i] = sum / Math.max(1, b - a); }
  return out;
}
function rmsOf(d, a=0, b=d.length){ let s = 0; for (let i = a; i < b; i++) s += d[i] * d[i]; return Math.sqrt(s / Math.max(1, b - a)); }
function toInt16(parts, len){
  const out = new Int16Array(len); let o = 0;
  for (const p of parts) for (let i = 0; i < p.length && o < len; i++) { const v = Math.max(-1, Math.min(1, p[i])); out[o++] = v < 0 ? v * 0x8000 : v * 0x7fff; }
  return out;
}
// חיתוך לקטעים של 12–25 שניות, ברגע של שקט, כדי לא לחתוך מילים באמצע
function splitAtSilence(d){
  const win = SR / 10, segs = []; let a = 0;
  for (let i = 0; i + win <= d.length; i += win) {
    const len = i + win - a;
    if ((len >= SR * 12 && rmsOf(d, i, i + win) < 0.015) || len >= SR * 25) { segs.push([a, i + win]); a = i + win; }
  }
  if (d.length - a > SR * 0.6) segs.push([a, d.length]);
  return segs;
}
function startLiveTranscription(rec, ac, src){
  const tr = rec.tr = { parts:[], len:0, offset:0, q:Promise.resolve(), pending:0, failed:0, lastErr:'', active:true };
  APP.trLive[rec.sessionId] = tr;
  const node = ac.createScriptProcessor(4096, 1, 1), mute = ac.createGain(); mute.gain.value = 0;
  src.connect(node); node.connect(mute); mute.connect(ac.destination);
  const ratio = ac.sampleRate / SR;
  node.onaudioprocess = e => {
    if (APP.rec !== rec || rec.paused || !tr.active) return;
    const ds = downsample(e.inputBuffer.getChannelData(0), ratio);
    tr.parts.push(ds); tr.len += ds.length;
    if ((tr.len >= SR * 12 && rmsOf(ds) < 0.015) || tr.len >= SR * 25) flushSegment(rec);
  };
  tr.node = node;
  setTrStatus(rec.sessionId);
}
function flushSegment(rec){
  const tr = rec.tr; if (!tr || !tr.len) return;
  const parts = tr.parts, len = tr.len, t = tr.offset;
  tr.offset += len / SR; tr.parts = []; tr.len = 0;
  if (len < SR * 0.6) return;
  const pcmF = new Float32Array(len); let o = 0; for (const p of parts) { pcmF.set(p, o); o += p.length; }
  if (rmsOf(pcmF) < 0.003) return;              // שקט — לא שולחים
  const pcm = toInt16([pcmF], len), sid = rec.sessionId;
  tr.pending++; setTrStatus(sid);
  tr.q = tr.q.then(() => TR.recognize(pcm)).then(text => appendTranscript(sid, t, text))
    .catch(e => { console.error(e); tr.failed++; tr.lastErr = e instanceof NeedAuth ? 'החיבור לגוגל פג' : e.message; markIncomplete(sid); })
    .finally(() => { tr.pending--; setTrStatus(sid); finishLive(sid); });
}
function finishLive(sid){
  const tr = APP.trLive[sid];
  if (tr && !tr.active && tr.pending === 0) { delete APP.trLive[sid]; setTrStatus(sid); if (tr.failed) toast(`${tr.failed} קטעי תמלול נכשלו. אפשר ללחוץ "תמלול מחדש" כדי לתמלל את כל ההקלטה.`, 'err'); }
}
function markIncomplete(sid){ const s = APP.db?.sessions[sid]; if (s && !s.deleted) { s.transcriptIncomplete = true; s.updatedAt = Date.now(); APP.ver++; scheduleSave(); } }
function appendTranscript(sid, t, text){
  text = (text || '').trim(); if (!text || !APP.db) return;
  const s = APP.db.sessions[sid]; if (!s || s.deleted) return;
  const cur = (s.transcript || '').replace(/\s+$/, '');
  s.transcript = (cur ? cur + '\n' : '') + `[${fmtDur(t)}] ${text}`;
  s.updatedAt = Date.now(); APP.ver++; setSync('pending'); scheduleSave();
  syncTranscriptBox(s);
}
function syncTranscriptBox(s){
  const ta = $(`textarea[data-sb="transcript"][data-sid="${s.id}"]`); if (!ta) return;
  const focused = document.activeElement === ta, a = ta.selectionStart, b = ta.selectionEnd;
  ta.value = s.transcript || '';
  if (focused) ta.setSelectionRange(a, b); else ta.scrollTop = ta.scrollHeight;
}
function trStatusHtml(s){
  const job = APP.trJob?.sid === s.id ? APP.trJob : null, tr = APP.trLive[s.id];
  if (job) return `<span class="chip info">מתמלל… ${job.done}/${job.total || '?'}</span>`;
  if (tr) return tr.failed ? `<span class="chip warn" title="${esc(tr.lastErr)}">שגיאת תמלול: ${esc(tr.lastErr.slice(0, 60))}</span>`
              : tr.pending ? `<span class="chip info">מתמלל…</span>` : `<span class="chip acc">תמלול בזמן אמת פעיל</span>`;
  if (s.transcriptIncomplete) return `<span class="chip warn">חלק מהתמלול חסר</span>`;
  return s.transcript ? `<span class="chip info">מתומלל</span>` : '';
}
function setTrStatus(sid){ const el = $('#trstatus-' + sid); const s = APP.db?.sessions[sid]; if (el && s) el.innerHTML = trStatusHtml(s); }

async function transcribeRecording(sid){
  const s = get('sessions', sid); if (!s?.recording) return;
  if (APP.trJob) { toast('תמלול אחר כבר רץ', 'err'); return; }
  if (s.transcript && !(await confirmDlg('לתמלל מחדש את כל ההקלטה? התמלול הקיים (כולל תיקונים ידניים) יוחלף.', 'תמלול מחדש'))) return;
  if (DriveStore.exp - Date.now() < 15*60000) { try { await DriveStore.auth(); } catch (e) { toast(e.message, 'err'); return; } }
  const job = APP.trJob = { sid, done:0, total:0 }; setTrStatus(sid);
  const lines = [];
  try {
    const bytes = await APP.store.get(s.recording.file); if (!bytes) throw new Error('קובץ ההקלטה לא נמצא');
    const plain = await decryptBytes(APP.key, bytes);
    const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const audio = await new Off(1, SR, SR).decodeAudioData(plain.buffer.slice(plain.byteOffset, plain.byteOffset + plain.byteLength));
    let d = audio.getChannelData(0);
    if (audio.numberOfChannels > 1) { const m = new Float32Array(d.length); for (let c = 0; c < audio.numberOfChannels; c++) { const x = audio.getChannelData(c); for (let i = 0; i < d.length; i++) m[i] += x[i] / audio.numberOfChannels; } d = m; }
    const segs = splitAtSilence(d); job.total = segs.length; setTrStatus(sid);
    for (const [a, b] of segs) {
      if (rmsOf(d, a, b) >= 0.003) { const text = await TR.recognize(toInt16([d.subarray(a, b)], b - a)); if (text) lines.push(`[${fmtDur(a / SR)}] ${text}`); }
      job.done++; setTrStatus(sid);
    }
    const cur = APP.db.sessions[sid]; cur.transcript = lines.join('\n'); delete cur.transcriptIncomplete; upsert('sessions', cur);
    toast('התמלול הושלם');
  } catch (e) {
    console.error(e);
    const cur = APP.db?.sessions[sid];
    if (cur && lines.length) { cur.transcript = lines.join('\n'); cur.transcriptIncomplete = true; upsert('sessions', cur); }
    toast('התמלול נעצר: ' + (e instanceof NeedAuth ? 'החיבור לגוגל פג' : e.message), 'err');
  } finally { APP.trJob = null; if (APP.key) render(); }
}

function updateRecPill(){
  const el = $('#recpill'); if (!el) return;
  el.innerHTML = APP.rec ? `<a class="recpill" href="#/session/${APP.rec.sessionId}"><span class="d"></span>${APP.rec.paused ? 'מושהה' : 'מקליט'} ${fmtDur(recElapsed())}</a>` : '';
}

            ${groupWhen(g) ? `<span>${ic('clock','ic ic-s')} ${esc(groupWhen(g))}</span>` : ''}${g.location ? `<span>${ic('pin','ic ic-s')} ${esc(g.location)}</span>` : ''}

        </a>`; }).join('') || `<div class="card"><div class="empty">עוד אין קבוצות. התחילי ב"קבוצה חדשה".</div></div>`}</div>`;
  }
  if (tab === 'plans') {
    const gf = APP.planFilter || '';
    const pls = all('plans').filter(pl => !gf || (gf === 'general' ? !pl.groupId : pl.groupId === gf)).sort((a,b) => (a.title||'').localeCompare(b.title||'', 'he'));
    body = `
      <div class="row" style="margin-bottom:14px"><select id="planfilter" style="max-width:260px"><option value="">כל המערכים</option><option value="general" ${gf==='general'?'selected':''}>כלליים (לא משויכים לקבוצה)</option>${all('groups').map(g => `<option value="${g.id}" ${gf===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><span class="sp"></span><button class="btn pri" data-act="newplan">${ic('plus')} מערך חדש</button></div>
      ${pls.map(planCard).join('') || `<div class="card"><div class="empty">אין מערכי טיפול</div></div>`}`;
  }
  if (tab === 'equipment') {
    const only = APP.eqFilter || 'all';
    const eq = all('equipment').filter(e => only === 'all' || (only === 'missing' ? (+e.need||0) > (+e.have||0) : (+e.have||0) > 0)).sort((a,b) => (a.category||'').localeCompare(b.category||'', 'he') || (a.name||'').localeCompare(b.name||'', 'he'));
    const missing = all('equipment').filter(e => (+e.need||0) > (+e.have||0));
    body = `
      <div class="row" style="margin-bottom:14px">
        <div class="seg">${[['all','הכל'],['have','קיים'],['missing',`חסר לרכישה (${missing.length})`]].map(([k,l]) => `<button class="${only===k?'on':''}" data-act="eqfilter" data-f="${k}">${l}</button>`).join('')}</div>
        <span class="sp"></span><button class="btn pri" data-act="newequip">${ic('plus')} פריט ציוד</button></div>
      <div class="card" style="padding:6px 12px"><table class="t eqt"><thead><tr><th>פריט</th><th>קטגוריה</th><th>קיים</th><th>נדרש</th><th>מיקום</th><th>בשימוש במערכים</th><th></th></tr></thead><tbody>
        ${eq.map(e => { const used = plansUsing(e.id); return `<tr data-act="editequip" data-id="${e.id}" style="cursor:pointer">
          <td><b>${esc(e.name)}</b>${e.notes ? `<div class="small muted">${esc(e.notes)}</div>` : ''}</td><td class="small">${esc(e.category)}</td>
          <td class="num"><span class="qty"><button class="iconbtn" data-act="eqqty" data-id="${e.id}" data-d="-1" aria-label="פחות">−</button><b>${+e.have||0}</b><button class="iconbtn" data-act="eqqty" data-id="${e.id}" data-d="1" aria-label="יותר">+</button></span></td>
          <td class="num">${+e.need||0}</td><td class="small">${esc(e.location)}</td>
          <td class="small">${used.map(pl => esc(pl.title)).join(', ') || '<span class="muted">—</span>'}</td><td>${equipChip(e)}</td></tr>`; }).join('') || `<tr><td colspan="7" class="empty">${only==='missing' ? 'אין ציוד חסר' : 'אין פריטי ציוד'}</td></tr>`}
      </tbody></table></div>`;
  }
  return { title:'קבוצות', html: `<div class="tabs">${tabs.map(([k,l]) => `<a href="#" data-act="gtab" data-tab="${k}" class="${tab===k?'on':''}">${l}</a>`).join('')}</div>${body}`,
    after(){ const f = $('#planfilter'); f && (f.onchange = () => { APP.planFilter = f.value; render(); }); } };
};

function planCard(pl, opts={}){
  const eq = (pl.equipment || []).map(x => ({ e: get('equipment', x.id), qty: +x.qty || 1 })).filter(x => x.e);
  const short = eq.filter(x => (+x.e.have||0) < x.qty);
  const block = (t, v) => v ? `<div class="sblock"><div class="q">${t}</div><div style="white-space:pre-wrap">${esc(v)}</div></div>` : '';
  return `<div class="card pcard">
    <h2>${ic('list')} ${esc(pl.title)}<span class="sp"></span>
      ${pl.groupId && !opts.inGroup ? `<a class="chip acc" href="#/group/${pl.groupId}" style="text-decoration:none">${esc(gname(pl.groupId))}</a>` : ''}${!pl.groupId ? '<span class="chip">כללי</span>' : ''}
      ${pl.duration ? `<span class="chip">${esc(pl.duration)} דק׳</span>` : ''}${short.length ? `<span class="chip warn">חסר ציוד</span>` : ''}
      <button class="btn sm" data-act="editplan" data-id="${pl.id}">${ic('edit')} עריכה</button></h2>
    ${pl.goals ? `<div class="clamp">${esc(pl.goals)}</div>` : ''}
    <details class="trx"><summary>המערך המלא</summary>
      ${block('קהל יעד', pl.audience)}${block('מטרות', pl.goals)}${block('פתיחה', pl.opening)}${block('מהלך מרכזי', pl.main)}${block('סיום', pl.closing)}
      ${eq.length || pl.extraEquipment ? `<div class="sblock"><div class="q">ציוד</div>${eq.map(x => `<div class="row" style="gap:6px;padding:3px 0">${esc(x.e.name)} × ${x.qty} ${(+x.e.have||0) >= x.qty ? '<span class="chip ok">יש</span>' : `<span class="chip warn">יש ${+x.e.have||0}</span>`}</div>`).join('')}${pl.extraEquipment ? `<div style="white-space:pre-wrap">${esc(pl.extraEquipment)}</div>` : ''}</div>` : ''}
      ${block('הערות', pl.notes)}
    </details>
  </div>`;
}

      <label class="f">אוכלוסייה / סוג<input type="text" name="population" value="${esc(g.population)}" placeholder="למשל: מתבגרים, הורים, נשים אחרי לידה"></label>
      <label class="f">מנחה שותף/ה<input type="text" name="coLeader" value="${esc(g.coLeader)}"></label>

      <label class="f full">הערות<textarea name="notes" style="min-height:60px">${esc(g.notes)}</textarea></label>

function planDialog(id, preset={}){

  const eqAll = all('equipment').sort((a,b) => (a.name||'').localeCompare(b.name||'', 'he'));

  openDialog({ title: id ? 'עריכת מערך טיפול' : 'מערך טיפול חדש', wide:true,
    body: `<div class="fgrid">
      <label class="f full">שם המערך *<input type="text" name="title" required value="${esc(pl.title)}"></label>
      <label class="f">קבוצה<select name="groupId"><option value="">כללי — לא משויך לקבוצה</option>${all('groups').map(g => `<option value="${g.id}" ${pl.groupId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>
      <label class="f">משך (דקות)<input type="number" name="duration" min="5" step="5" value="${esc(pl.duration)}"></label>
      <label class="f full">קהל יעד<input type="text" name="audience" value="${esc(pl.audience)}"></label>
      <label class="f full">מטרות<textarea name="goals" style="min-height:70px">${esc(pl.goals)}</textarea></label>
      <label class="f full">פתיחה<textarea name="opening" style="min-height:70px">${esc(pl.opening)}</textarea></label>
      <label class="f full">מהלך מרכזי<textarea name="main" style="min-height:110px">${esc(pl.main)}</textarea></label>
      <label class="f full">סיום<textarea name="closing" style="min-height:70px">${esc(pl.closing)}</textarea></label>
      <div class="full"><b class="small">ציוד מהמלאי</b>
        ${eqAll.length ? `<div class="eqpick">${eqAll.map(e => `<label class="check"><input type="checkbox" data-eq="${e.id}" ${sel[e.id] ? 'checked' : ''}> <span style="flex:1">${esc(e.name)} <span class="muted small">(קיים ${+e.have||0})</span></span><input type="number" data-eqq="${e.id}" min="1" value="${esc(sel[e.id] || 1)}" style="width:72px;min-height:34px;padding:4px 8px" aria-label="כמות"></label>`).join('')}</div>`
          : `<div class="small muted">אין עדיין פריטים במלאי. אפשר להוסיף אותם בלשונית "ציוד".</div>`}</div>
      <label class="f full">ציוד נוסף (שאינו במלאי)<textarea name="extraEquipment" style="min-height:50px">${esc(pl.extraEquipment)}</textarea></label>
      <label class="f full">הערות<textarea name="notes" style="min-height:60px">${esc(pl.notes)}</textarea></label>
    </div>`,
    extra: id ? `<button type="button" class="btn danger" data-act="delplan" data-id="${id}">${ic('trash')} מחיקה</button>` : '',
    onSubmit(fd, form){
      for (const k of ['title','groupId','duration','audience','goals','opening','main','closing','extraEquipment','notes']) pl[k] = (fd.get(k) || '').toString().trim();
      pl.equipment = $$('[data-eq]', form).filter(c => c.checked).map(c => ({ id: c.dataset.eq, qty: Math.max(1, +$(`[data-eqq="${c.dataset.eq}"]`, form).value || 1) }));

}

function equipDialog(id){
  const e = id ? structuredClone(get('equipment', id)) : { have: 0, need: 0 };

  openDialog({ title: id ? 'עריכת פריט ציוד' : 'פריט ציוד חדש',
    body: `<div class="fgrid">
      <label class="f full">שם הפריט *<input type="text" name="name" required value="${esc(e.name)}"></label>
      <label class="f">קטגוריה<input type="text" name="category" list="eqcats" value="${esc(e.category)}" placeholder="יצירה, משחקים, קלפים…"><datalist id="eqcats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
      <label class="f">מיקום אחסון<input type="text" name="location" value="${esc(e.location)}"></label>
      <label class="f">כמות קיימת<input type="number" name="have" min="0" value="${esc(e.have)}"></label>
      <label class="f">כמות נדרשת<input type="number" name="need" min="0" value="${esc(e.need)}"></label>

    extra: id ? `<button type="button" class="btn danger" data-act="delequip" data-id="${id}">${ic('trash')} מחיקה</button>` : '',
